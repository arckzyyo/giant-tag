<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#430107" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GIANT TAG" />
<meta name="description" content="A real-life game of tag across your whole town." />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>GIANT TAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root {
  /* Palette: Midnight Cherry #430107 · Powder White #FFEEEE · Amber Yellow #FECD00 */
  --bg: #430107; --bg-deep: #2B0004; --card: #570A12; --card2: #69121B; --border: #832430;
  --text: #FFEEEE; --muted: #E7BFBF; --faint: #BC8E8E; --on-amber: #430107;
  --it: #FECD00; --it-glow: rgba(254,205,0,.38); --player: #3B82F6; --me: #22C55E; --gray: #8F7476;
  --boundary: #FECD00; --safe: #2DD4BF; --warning: #F59E0B; --danger: #FF5A5F; --success: #22C55E;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
body { -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
#app { min-height: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
a { color: var(--player); }

.screen { min-height: 100vh; min-height: 100dvh; padding: calc(var(--st) + 10px) 18px calc(var(--sb) + 28px); max-width: 560px; margin: 0 auto; }
.full { position: fixed; inset: 0; overflow: hidden; }
.center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.gap8 { display: flex; flex-direction: column; gap: 8px; }
.gap12 { display: flex; flex-direction: column; gap: 12px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }

.h1 { font-size: 30px; font-weight: 900; font-style: italic; letter-spacing: .5px; margin: 0; }
.h2 { font-size: 19px; font-weight: 800; margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.small { color: var(--faint); font-size: 12px; line-height: 1.4; }
.bold { font-weight: 700; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.logo { display: flex; flex-direction: column; align-items: center; line-height: 1; font-weight: 900; font-style: italic; }
.logo .a { font-size: 64px; color: var(--text); text-shadow: 0 0 18px rgba(255,238,238,.35); }
.logo .b { font-size: 80px; color: var(--it); margin-top: -8px; text-shadow: 0 0 24px var(--it-glow); }

.header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.header .title { flex: 1; text-align: center; font-size: 20px; font-weight: 800; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; background: var(--card); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 18px;
  border-radius: 16px; font-weight: 800; font-size: 16px; letter-spacing: .3px; transition: transform .1s, opacity .1s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn.big { padding: 18px; font-size: 19px; border-radius: 22px; }
.btn.primary { background: var(--text); color: var(--bg); }
.btn.it { background: var(--it); color: var(--on-amber); box-shadow: 0 6px 24px var(--it-glow); }
.btn.success { background: var(--success); color: #04130a; }
.btn.secondary { background: var(--card2); border: 1.5px solid var(--border); }
.btn.danger { border: 1.5px solid var(--danger); color: var(--danger); }
.btn.ghost { color: var(--muted); }
.btn.inline { width: auto; padding: 10px 14px; font-size: 14px; border-radius: 12px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 16px; }
.section { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 10px; }
.section > span:first-child { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }

.label { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 6px; display: block; }
.input { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
  padding: 13px 14px; font-size: 16px; outline: none; }
.input:focus { border-color: var(--it); }
.field { margin-bottom: 14px; }

.seg { display: flex; background: var(--card2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; color: var(--muted); font-weight: 700; font-size: 13px; }
.seg button.on { background: var(--border); color: var(--text); }

.line { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.line:last-child { border-bottom: 0; }
.line .lbl { flex: 1; font-size: 15px; font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 32px; height: 32px; border-radius: 16px; background: var(--card2); font-size: 18px; font-weight: 700; }
.stepper .v { min-width: 70px; text-align: center; font-weight: 800; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--border); position: relative; transition: background .2s; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--text); transition: left .2s; }
.switch.on { background: var(--it); }
.switch.on::after { left: 23px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;
  background: var(--card2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 4px; display: inline-block; }

.avatar { border-radius: 50%; display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.list-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border-radius: 16px;
  margin-bottom: 8px; border: 1.5px solid var(--border); }
.list-row.tap:active { opacity: .7; }

.mode { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card);
  border: 1.5px solid var(--border); text-align: left; width: 100%; }
.mode.on { border-color: var(--it); background: var(--card2); }
.radio { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--faint); flex-shrink: 0; }
.mode.on .radio { border-color: var(--it); background: var(--it); }

.grid-pick { display: flex; flex-wrap: wrap; gap: 10px; }
.grid-pick button { width: 56px; height: 56px; border-radius: 16px; background: var(--card); font-size: 26px; border: 2px solid transparent; }
.grid-pick button.on { border-color: var(--it); background: var(--card2); }
.swatch { width: 44px !important; height: 44px !important; border-radius: 22px !important; border: 3px solid transparent !important; }
.swatch.on { border-color: var(--text) !important; }

.code-box { text-align: center; background: var(--card); border: 2px dashed var(--it); border-radius: 22px; padding: 16px; margin: 16px 0; }
.code-big { font-size: 44px; font-weight: 900; letter-spacing: 10px; margin-top: 4px; }
.code-input { width: 100%; background: var(--card); color: var(--text); border: 2px solid var(--border); border-radius: 22px;
  font-size: 40px; font-weight: 900; letter-spacing: 10px; text-align: center; padding: 18px 0; margin: 20px 0; text-transform: uppercase; outline: none; }

.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.stats.two { grid-template-columns: 1fr 1fr; }
.stat { background: var(--card); border-radius: 16px; padding: 14px; text-align: center; }
.stat .v { font-size: 22px; font-weight: 800; }

/* Toasts */
.toasts { position: fixed; left: 12px; right: 12px; top: calc(var(--st) + 8px); z-index: 3000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 560px; margin: 0 auto; }
.toast { pointer-events: auto; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card2);
  box-shadow: 0 6px 24px rgba(0,0,0,.5); animation: drop .25s ease-out; }
.toast .t { font-weight: 800; font-size: 15px; } .toast .b { font-size: 13px; opacity: .88; margin-top: 2px; }
.toast.it { background: var(--it); color: var(--on-amber); } .toast.it .t { font-size: 18px; }
.toast.danger { background: #8E1420; } .toast.success { background: #14532d; } .toast.warning { background: #7A4A00; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Modals & sheets */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end; }
.backdrop.centered { justify-content: center; padding: 24px; background: rgba(0,0,0,.75); }
.sheet { background: var(--card); border-radius: 24px 24px 0 0; padding: 14px 20px calc(var(--sb) + 20px); max-height: 80vh; overflow-y: auto;
  animation: up .2s ease-out; max-width: 560px; width: 100%; margin: 0 auto; }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 12px; }
.modal { background: var(--card); border-radius: 24px; padding: 22px; border: 2px solid var(--border); max-width: 420px; width: 100%; margin: 0 auto; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }

/* Map screens */
.map { position: absolute; inset: 0; background: var(--bg-deep); }
.leaflet-container { background: var(--bg-deep); font-family: inherit; }
.leaflet-control-attribution { background: rgba(0,0,0,.5) !important; color: #888 !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: #aaa !important; }
.leaflet-div-icon { background: none; border: 0; }
.hud-top { position: absolute; left: 10px; right: 10px; top: calc(var(--st) + 6px); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.glass { background: rgba(67,1,7,.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills .pill { background: rgba(67,1,7,.92); }

.it-banner { display: flex; align-items: center; gap: 10px; background: var(--it); color: var(--on-amber); border-radius: 22px; padding: 10px 12px;
  border: 2px solid rgba(67,1,7,.25); box-shadow: 0 4px 24px var(--it-glow); }
.it-banner.me { border: 3px solid var(--text); animation: throb 1.2s infinite; }
.it-banner .l { font-size: 11px; font-weight: 900; letter-spacing: 1.5px; opacity: .85; }
.it-banner .n { font-size: 22px; font-weight: 900; font-style: italic; }
.it-badge { background: var(--bg); color: var(--it); font-weight: 900; font-style: italic; border-radius: 8px; padding: 2px 8px; font-size: 14px; }
@keyframes throb { 50% { box-shadow: 0 0 40px var(--it); } }

.banner { border-radius: 16px; padding: 12px; }
.banner .t { font-weight: 900; font-size: 16px; } .banner .b { font-size: 13px; opacity: .92; margin-top: 2px; }

.overlay { position: absolute; inset: 0; z-index: 900; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,.35); pointer-events: none; }
.big-count { font-size: 120px; font-weight: 900; font-style: italic; color: var(--it); text-shadow: 0 0 30px var(--it-glow); line-height: 1; }
.big-sub { font-size: 22px; font-weight: 900; font-style: italic; }

.hud-bottom { position: absolute; left: 10px; right: 10px; bottom: calc(var(--sb) + 12px); z-index: 1000; pointer-events: none; }
.hud-bottom > * { pointer-events: auto; }
.side-btns { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; margin-bottom: 10px; pointer-events: none; }
.side-btns > * { pointer-events: auto; }
.round { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; font-size: 20px; border: 1px solid var(--border); }
.round.on { background: var(--it); color: var(--on-amber); }
.bar { display: flex; align-items: center; justify-content: space-between; border-radius: 32px; padding: 0 20px; height: 72px; border: 1px solid var(--border); }
.bar-btn { width: 70px; display: flex; flex-direction: column; align-items: center; font-size: 22px; }
.bar-btn span { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.tag-btn { width: 92px; height: 92px; border-radius: 46px; background: var(--it); color: var(--on-amber); margin-top: -36px; border: 4px solid var(--bg);
  font-size: 24px; font-weight: 900; font-style: italic; box-shadow: 0 0 24px var(--it); display: grid; place-items: center; }
.tag-btn:active { transform: scale(.94); }
.tag-btn.off { background: var(--card2); color: var(--text); box-shadow: none; font-size: 18px; }

.pcard { position: absolute; left: 10px; right: 10px; z-index: 1100; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 16px; }

/* Player markers */
.pm { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
.pm-ring { border: 3px solid; border-radius: 50%; padding: 1px; background: var(--bg-deep); position: relative; z-index: 2; }
.pm-dim { opacity: .45; }
.pm .pulse { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: var(--it); animation: pulse 1.4s ease-out infinite; z-index: 1; }
@keyframes pulse { from { transform: scale(.8); opacity: .7; } to { transform: scale(2.3); opacity: 0; } }
.pm-badge { position: absolute; bottom: 2px; z-index: 3; background: var(--it); color: var(--on-amber); font-weight: 900; font-style: italic; font-size: 10px;
  padding: 1px 6px; border-radius: 6px; border: 1.5px solid var(--bg); }
.pm-name { position: absolute; top: 58px; z-index: 3; font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap; text-shadow: 0 1px 3px var(--bg-deep), 0 0 2px var(--bg-deep); }
.pm-frozen { position: absolute; top: 2px; right: 6px; z-index: 3; font-size: 16px; }

.vertex { width: 26px; height: 26px; border-radius: 13px; background: var(--boundary); border: 2px solid var(--on-amber); color: var(--on-amber); font-weight: 900;
  font-size: 11px; display: grid; place-items: center; }
.vertex.sel { background: var(--text); transform: scale(1.25); }
.safe-mk { width: 30px; height: 30px; border-radius: 15px; background: var(--bg-deep); border: 2px solid var(--safe); display: grid; place-items: center; font-size: 14px; }
.safe-mk.sel { border-color: var(--text); }

.search { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 14px; height: 46px; border: 1px solid var(--border); flex: 1; }
.search input { flex: 1; background: none; border: 0; color: var(--text); font-size: 16px; outline: none; min-width: 0; }
.tip { font-size: 12px; padding: 6px 10px; border-radius: 10px; align-self: flex-start; }
.editor-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; border-radius: 24px 24px 0 0; padding: 14px 14px calc(var(--sb) + 12px);
  border-top: 1px solid var(--border); max-width: 560px; margin: 0 auto; }
.mode-row { display: flex; gap: 8px; margin-bottom: 12px; }
.mode-row button { flex: 1; padding: 10px; border-radius: 14px; background: var(--card2); font-weight: 800; }
.mode-row button.b-on { background: var(--boundary); color: var(--on-amber); }
.mode-row button.s-on { background: var(--safe); color: var(--on-amber); }

.mini-map { height: 170px; border-radius: 22px; overflow: hidden; margin-top: 16px; border: 1px solid var(--border); position: relative; }
.mini-map .map { pointer-events: none; }
.mini-label { position: absolute; left: 10px; bottom: 10px; z-index: 500; background: rgba(0,0,0,.7); border-radius: 8px; padding: 4px 8px; font-size: 12px; }

.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--it); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

.a2hs { background: linear-gradient(135deg, #69121B, #832430); border: 1px solid var(--it); border-radius: 18px; padding: 14px; margin-top: 18px; }

.ping-ring { position: absolute; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--text); animation: ping 1.2s ease-out 2; z-index: 1; }
@keyframes ping { from { transform: scale(.8); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
.pm.ping-fade { animation: pingfade 10s linear forwards; }
@keyframes pingfade { 0%, 55% { opacity: 1; } 100% { opacity: 0; } }
.tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) sepia(.6) hue-rotate(-45deg) saturate(1.8); }

/* =========================== ARCADE SKIN =========================== */
body {
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(254,205,0,.10), transparent 60%),
    radial-gradient(900px 700px at 110% 110%, rgba(255,238,238,.06), transparent 60%),
    linear-gradient(rgba(255,238,238,.035) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(255,238,238,.035) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--bg);
  background-attachment: fixed;
}
.screen { animation: screen-in .28s ease-out; }
@keyframes screen-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.h1, .header .title, .big-sub, .it-banner .n, .tag-btn, .code-big, .code-input, .big-count, .h2.display {
  font-family: "Bungee", "Rubik", sans-serif; font-style: normal; letter-spacing: .5px; font-weight: 400;
}
.h1 { font-size: 26px; text-shadow: 0 3px 0 var(--bg-deep); }
.header .title { font-size: 17px; letter-spacing: 1px; }
.tagline { color: var(--muted); font-weight: 500; letter-spacing: .3px; margin-top: 14px; }

/* Logo: stacked, 3D, tilted */
.logo-wrap { position: relative; display: grid; place-items: center; }
.logo-wrap.with-radar { min-height: 250px; }
.logo { font-family: "Bungee", sans-serif; font-style: normal; transform: rotate(-4deg); position: relative; z-index: 2; }
.logo .a { font-size: 58px; color: var(--text); letter-spacing: 2px;
  text-shadow: 0 4px 0 #9b2a35, 0 8px 0 var(--bg-deep), 0 10px 24px rgba(0,0,0,.5); }
.logo .b { font-size: 92px; color: var(--it); margin-top: -6px; letter-spacing: 4px;
  text-shadow: 0 5px 0 #b38f00, 0 10px 0 var(--bg-deep), 0 0 40px rgba(254,205,0,.35); animation: logo-bob 3s ease-in-out infinite; }
@keyframes logo-bob { 50% { transform: translateY(-4px); } }

/* Radar */
.radar { position: absolute; width: 250px; height: 250px; border-radius: 50%; z-index: 1;
  background:
    radial-gradient(circle, transparent 0 34%, rgba(254,205,0,.16) 34.5% 35%, transparent 35.5% 59%, rgba(254,205,0,.16) 59.5% 60%, transparent 60.5% 84%, rgba(254,205,0,.22) 84.5% 85.5%, transparent 86%),
    linear-gradient(rgba(254,205,0,.12), rgba(254,205,0,.12)) center / 1px 100% no-repeat,
    linear-gradient(rgba(254,205,0,.12), rgba(254,205,0,.12)) center / 100% 1px no-repeat,
    radial-gradient(circle, rgba(105,18,27,.9), rgba(43,0,4,.6));
  box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 0 2px rgba(254,205,0,.25); overflow: hidden; }
.radar .sweep { position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(254,205,0,.45), rgba(254,205,0,.0) 70deg, transparent 360deg);
  animation: sweep 3.2s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.radar .blip { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--text);
  box-shadow: 0 0 10px var(--text); animation: blip 3.2s linear infinite; opacity: 0; }
.radar .blip.it { background: var(--it); box-shadow: 0 0 14px var(--it); width: 13px; height: 13px; }
.radar .b1 { top: 22%; left: 66%; animation-delay: .35s; }
.radar .b2 { top: 70%; left: 24%; animation-delay: 2.1s; }
.radar .b3 { top: 64%; left: 72%; animation-delay: 1.25s; }
@keyframes blip { 0% { opacity: 1; transform: scale(1.3); } 60% { opacity: .15; transform: scale(1); } 100% { opacity: 0; } }

/* Chunky 3D game buttons */
.btn { font-family: "Rubik", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: .8px;
  border-radius: 18px; transition: transform .08s, box-shadow .08s, filter .15s; position: relative; }
.btn.big { font-family: "Bungee", sans-serif; font-weight: 400; font-size: 20px; letter-spacing: 1px; border-radius: 20px; padding: 17px; }
.btn.it { box-shadow: 0 6px 0 #a88600, 0 10px 26px rgba(254,205,0,.28); }

<script type="module">
// ===== lib.js =====
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useRef, useMemo, useCallback } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';

const html = htm.bind(h);

// ---------------------------------------------------------------- config
const CFG = window.GIANT_TAG_CONFIG || {};
const isConfigured = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && !CFG.supabaseUrl.includes('YOUR'));
const supabase = createClient(CFG.supabaseUrl || 'https://example.supabase.co', CFG.supabaseAnonKey || 'x', {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'giant-tag-auth' },
  realtime: { params: { eventsPerSecond: 20 } },

function errorMessage(e) {
  if (!e) return 'Something went wrong';
  const m = typeof e === 'string' ? e : e.message || 'Something went wrong';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No internet connection';
  return m;
}
async function rpc(fn, args) {
  const { data, error } = await supabase.rpc(fn, args);
  if (error) throw new Error(errorMessage(error));
  return data;
}

// ---------------------------------------------------------------- tiny stores
function createStore(init) {
  let s = init; const ls = new Set();
  return {
    get: () => s,
    set(p) { s = { ...s, ...(typeof p === 'function' ? p(s) : p) }; ls.forEach((l) => l()); },
    replace(v) { s = v; ls.forEach((l) => l()); },
    sub(l) { ls.add(l); return () => ls.delete(l); },
  };
}
function useStore(store) {
  const [, force] = useState(0);
  const seen = store.get();
  useEffect(() => {
    const unsub = store.sub(() => force((x) => x + 1));
    if (store.get() !== seen) force((x) => x + 1); // changed before we subscribed
    return unsub;
  }, [store]);
  return store.get();
}

// ---------------------------------------------------------------- router (hash based)
const routeStore = createStore({ path: location.hash.slice(1) || '/' });
window.addEventListener('hashchange', () => routeStore.replace({ path: location.hash.slice(1) || '/' }));

const replace = (p) => { history.replaceState(null, '', '#' + p); routeStore.replace({ path: p }); };
const back = (fallback = '/home') => { if (history.length > 1) history.back(); else replace(fallback); };
function parseRoute(path) {
  const [p, q] = path.split('?');
  return { parts: p.split('/').filter(Boolean), query: Object.fromEntries(new URLSearchParams(q || '')) };
}

// ---------------------------------------------------------------- prefs
const PREF_KEY = 'giant-tag:prefs';
const PREF_DEFAULTS = { haptics: true, mapType: 'dark', showAccuracy: true, followMe: false, proximityAlerts: true, showNames: true };
let savedPrefs = {};
try { savedPrefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch {}
const prefsStore = createStore({ ...PREF_DEFAULTS, ...savedPrefs });
prefsStore.sub(() => { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefsStore.get())); } catch {} });
const setPref = (k, v) => prefsStore.set({ [k]: v });

// ---------------------------------------------------------------- toasts
const toastStore = createStore({ list: [] });
let toastId = 1;
function toast({ title, body, tone = 'info' }) {
  const id = toastId++;
  toastStore.set((s) => ({ list: [...s.list.slice(-2), { id, title, body, tone }] }));
  if (prefsStore.get().haptics && navigator.vibrate && tone !== 'info') navigator.vibrate(tone === 'it' ? [0, 200, 100, 200] : 120);
  setTimeout(() => toastStore.set((s) => ({ list: s.list.filter((t) => t.id !== id) })), tone === 'it' ? 5000 : 3500);
}

// ---------------------------------------------------------------- auth
const authStore = createStore({ session: null, profile: null, loading: true });
async function loadProfile() {
  const uid = authStore.get().session?.user?.id;
  if (!uid) { authStore.set({ profile: null }); return null; }
  const { data } = await supabase.from('profiles').select('*').eq('id', uid).maybeSingle();
  authStore.set({ profile: data || null });
  return data;
}
// Realtime must carry the player's login, or row-level security filters out every live update.
const syncRealtimeAuth = (session) => { try { supabase.realtime.setAuth(session?.access_token || null); } catch {} };
window.__gt = { supabase };
if (isConfigured) {
  supabase.auth.getSession().then(async ({ data }) => {
    syncRealtimeAuth(data.session);
    authStore.set({ session: data.session });
    await loadProfile();
    authStore.set({ loading: false });
  });
  supabase.auth.onAuthStateChange((_e, session) => {
    syncRealtimeAuth(session);
    const prev = authStore.get().session?.user?.id;
    authStore.set({ session });
    if (session?.user?.id !== prev) loadProfile();
  });
} else {
  authStore.set({ loading: false });
}

// ---------------------------------------------------------------- types / constants
const MODE_INFO = {
  classic: { title: 'Classic Tag', emoji: '🏃', blurb: 'Whoever gets tagged becomes IT. Spend the least time as IT to win.' },
  infection: { title: 'Infection', emoji: '🧟', blurb: 'Everyone tagged joins the IT team. Last survivor wins.' },
  elimination: { title: 'Elimination', emoji: '💀', blurb: 'Tagged players are out. Last runner standing wins.' },
  team: { title: 'Team Tag', emoji: '⚔️', blurb: 'Two teams hunt each other. Most players left wins.' },
  last_standing: { title: 'Last Person Standing', emoji: '👑', blurb: 'Tagged players are out, and a new hunter is released every few minutes.' },
};
const TEAM_INFO = { alpha: { name: 'Team Blaze', color: '#F97316' }, bravo: { name: 'Team Volt', color: '#A855F7' } };
const AVATAR_EMOJIS = ['🏃', '🦊', '🐺', '🦖', '🐸', '🐯', '🦄', '🐙', '👻', '🤖', '🥷', '🧙', '🦸', '🐼', '🐵', '🔥'];
const AVATAR_COLORS = ['#3B82F6', '#22C55E', '#F97316', '#A855F7', '#EC4899', '#14B8A6', '#EAB308', '#64748B'];
const C = {
  it: '#FECD00', player: '#3B82F6', me: '#22C55E', gray: '#8F7476', boundary: '#FECD00', safe: '#2DD4BF',
  warning: '#F59E0B', danger: '#FF5A5F', success: '#22C55E', card2: '#69121B', muted: '#E7BFBF',
  cherry: '#430107', powder: '#FFEEEE', amber: '#FECD00',
};

const DEFAULT_SETTINGS = {
  name: '', mode: 'classic', location_name: null, boundary: [], safe_zones: [], max_radius_m: null,
  max_players: 20, duration_seconds: 1800, countdown_seconds: 60, starting_it_id: null, tag_radius_m: 10,
  tag_back_cooldown_seconds: 60, tag_confirm_timeout_seconds: 60, escalation_interval_seconds: 300,
  out_of_bounds_action: 'become_it', grace_seconds: 20, speed_limit_mph: 18, speed_grace_seconds: 10, it_ping_seconds: 60,
  allow_rejoin: false, allow_spectators: true, location_retention_hours: 24,
};
const draftStore = createStore({ ...DEFAULT_SETTINGS });
const settingsOf = (g) => Object.fromEntries(Object.keys(DEFAULT_SETTINGS).map((k) => [k, g[k]]));

// ---------------------------------------------------------------- geo
const R = 6371000;
const rad = (d) => (d * Math.PI) / 180;
function distanceM(a, b) {
  const dLat = rad(b.latitude - a.latitude), dLng = rad(b.longitude - a.longitude);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.latitude)) * Math.cos(rad(b.latitude)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function pointInPolygon(p, poly) {
  if (!poly || poly.length < 3) return true;
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].longitude, yi = poly[i].latitude, xj = poly[j].longitude, yj = poly[j].latitude;
    if (yi > p.latitude !== yj > p.latitude && p.longitude < ((xj - xi) * (p.latitude - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function distanceToEdgeM(p, poly) {
  if (!poly || poly.length < 2) return Infinity;
  const kx = Math.cos(rad(p.latitude)) * R * (Math.PI / 180), ky = R * (Math.PI / 180);
  const pts = poly.map((q) => ({ x: (q.longitude - p.longitude) * kx, y: (q.latitude - p.latitude) * ky }));
  let best = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length], dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
    const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, -(a.x * dx + a.y * dy) / len2));
    best = Math.min(best, Math.hypot(a.x + t * dx, a.y + t * dy));
  }
  return best;
}
function centroid(poly) {
  if (!poly?.length) return null;
  const s = poly.reduce((a, p) => ({ latitude: a.latitude + p.latitude, longitude: a.longitude + p.longitude }), { latitude: 0, longitude: 0 });
  return { latitude: s.latitude / poly.length, longitude: s.longitude / poly.length };
}
const maxDistanceFromCentre = (poly) => { const c = centroid(poly); return c ? Math.max(...poly.map((p) => distanceM(c, p))) : 0; };
function areaKm2(poly) {
  if (!poly || poly.length < 3) return 0;
  const c = centroid(poly), kx = Math.cos(rad(c.latitude)) * R * (Math.PI / 180), ky = R * (Math.PI / 180);
  let s = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    s += a.longitude * kx * (b.latitude * ky) - b.longitude * kx * (a.latitude * ky);
  }
  return Math.abs(s / 2) / 1e6;
}
const inSafeZone = (p, zones) => (zones || []).find((z) => distanceM(p, z) <= z.radius) || null;
const toLL = (p) => [p.latitude, p.longitude];
const fromLL = (ll) => ({ latitude: ll.lat, longitude: ll.lng });
function formatDistance(m) {
  if (m == null || !isFinite(m)) return '—';
  return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km`;
}

// ---------------------------------------------------------------- format
function formatClock(sec) {
  const s = Math.max(0, Math.floor(sec)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return `${h ? h + ':' : ''}${h ? String(m).padStart(2, '0') : m}:${String(x).padStart(2, '0')}`;
}
function formatDuration(sec) {
  const s = Math.max(0, Math.floor(sec || 0));
  if (s < 60) return `${s}s`;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m ${s % 60}s`;
}
function timeAgo(iso, now = Date.now()) {
  if (!iso) return 'never';
  const s = Math.max(0, Math.round((now - new Date(iso).getTime()) / 1000));
  if (s < 5) return 'just now'; if (s < 60) return `${s}s ago`; if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  return `${Math.floor(s / 3600)}h ago`;
}
const secondsSince = (iso, now = Date.now()) => (iso ? (now - new Date(iso).getTime()) / 1000 : Infinity);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const safeUrl = (u) => (typeof u === 'string' && /^https:\/\//.test(u) ? u : null);

// ---------------------------------------------------------------- game logic (mirrors server rules)
const INACTIVE_AFTER_S = 90;
function playerState(p, loc, game, now = Date.now()) {
  if (p.left_at) return 'left';
  if (p.role === 'spectator') return 'spectator';
  if (p.is_eliminated) return 'eliminated';
  const live = game && ['countdown', 'active', 'paused'].includes(game.status);
  if (live && secondsSince(loc?.updated_at ?? p.last_seen_at, now) > INACTIVE_AFTER_S) return 'inactive';
  return p.is_it ? 'it' : 'active';
}
const STATE_LABEL = { it: 'IT', active: 'Running', eliminated: 'Eliminated', spectator: 'Spectating', left: 'Left the game', inactive: 'Signal lost' };
function survivalSeconds(p, game, now = Date.now()) {
  if (p.survival_seconds != null) return p.survival_seconds;
  if (!game.started_at) return 0;
  const start = new Date(game.started_at).getTime();
  const paused = game.paused_seconds + (game.paused_at ? (now - new Date(game.paused_at).getTime()) / 1000 : 0);
  if (game.mode === 'classic') {
    const itNow = p.it_since ? Math.max(0, (now - new Date(p.it_since).getTime()) / 1000) : 0;
    const end = p.left_at ? new Date(p.left_at).getTime() : now;
    return Math.max(0, (end - start) / 1000 - paused - p.it_total_seconds - itNow);
  }
  const end = p.caught_at ?? p.left_at;
  if (end) return Math.max(0, (new Date(end).getTime() - start) / 1000);
  return Math.max(0, (now - start) / 1000 - paused);
}
const isFrozen = (p, now = Date.now()) => !!p?.frozen_until && new Date(p.frozen_until).getTime() > now;
function canTag(me, them, game) {
  if (!me || !game || game.status !== 'active' || me.user_id === them.user_id) return false;
  if (me.role !== 'player' || me.left_at || me.is_eliminated || me.is_paused || isFrozen(me)) return false;
  if (them.role !== 'player' || them.left_at || them.is_eliminated || them.is_paused) return false;
  if (game.mode === 'team') return !!me.team && me.team !== them.team;
  return me.is_it && !them.is_it;
}
function isTagger(me, game) {
  if (!me || !game || me.role !== 'player' || me.is_eliminated || me.left_at) return false;
  return game.mode === 'team' ? true : me.is_it;
}
function remainingCount(players, game) {
  const inGame = players.filter((p) => p.role === 'player' && !p.left_at && !p.is_eliminated);
  if (!game || game.mode === 'classic' || game.mode === 'team') return inGame.length;
  return inGame.filter((p) => !p.is_it).length;
}
function gameSecondsLeft(game, now = Date.now()) {
  if (!game.ends_at) return game.duration_seconds;
  const ref = game.status === 'paused' && game.paused_at ? new Date(game.paused_at).getTime() : now;
  return Math.max(0, (new Date(game.ends_at).getTime() - ref) / 1000);
}
function gamePath(g) {
  if (g.status === 'lobby') return `/g/${g.id}/lobby`;
  if (['countdown', 'active', 'paused'].includes(g.status)) return `/g/${g.id}/play`;
  return `/g/${g.id}/results`;
}

// ---------------------------------------------------------------- hooks
function useNow(ms = 1000) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), ms); return () => clearInterval(t); }, [ms]);
  return now;
}

/** Live game state via Supabase Realtime (RLS-filtered). Resyncs on reconnect and when the tab becomes visible. */
function useGame(gameId, onEvent) {
  const [st, setSt] = useState({ game: null, players: [], locations: {}, pings: {}, requests: [], history: [], loading: true, error: null, connected: false });
  const set = (p) => setSt((s) => ({ ...s, ...(typeof p === 'function' ? p(s) : p) }));
  const onEventRef = useRef(onEvent); onEventRef.current = onEvent;
  const seen = useRef(new Set());
  const once = useRef(false);
  const [attempt, setAttempt] = useState(0);

  const loadPlayers = useCallback(async () => {
    const { data } = await supabase.from('game_players').select('*, profile:profiles(*)').eq('game_id', gameId).order('joined_at');
    if (data) set({ players: data });
  }, [gameId]);
  const loadRequests = useCallback(async () => {
    const { data } = await supabase.from('tag_requests').select('*').eq('game_id', gameId).in('status', ['pending', 'disputed']).order('created_at');
    if (data) set({ requests: data });
  }, [gameId]);
  const loadPings = useCallback(async () => {
    const { data } = await supabase.from('location_pings').select('*').eq('game_id', gameId);
    const map = {}; (data || []).forEach((l) => (map[l.user_id] = l));
    set({ pings: map });
  }, [gameId]);
  const loadLocations = useCallback(async () => {
    const { data } = await supabase.from('player_locations').select('*').eq('game_id', gameId);
    const map = {}; (data || []).forEach((l) => (map[l.user_id] = l));
    set({ locations: map });
  }, [gameId]);
  const reload = useCallback(async () => {
    try {
      const [g, , locs, hist] = await Promise.all([
        supabase.from('games').select('*').eq('id', gameId).single(),
        loadPlayers(),
        supabase.from('player_locations').select('*').eq('game_id', gameId),
        supabase.from('tag_history').select('*').eq('game_id', gameId).order('created_at'),
        loadRequests(),
        loadPings(),
      ]);
      if (g.error) throw g.error;
      const map = {}; (locs.data || []).forEach((l) => (map[l.user_id] = l));
      set({ game: g.data, locations: map, history: hist.data || [], error: null, loading: false });
    } catch (e) { set({ error: errorMessage(e), loading: false }); }
  }, [gameId, loadPlayers, loadRequests]);

  useEffect(() => {
    if (!gameId) return;
    reload();
    let retryTimer = null;
    const filter = `game_id=eq.${gameId}`;
    const ch = supabase.channel(`game:${gameId}:${Math.random().toString(36).slice(2, 7)}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'games', filter: `id=eq.${gameId}` },
        (p) => {
          if (!p.new?.id) return;
          // Large unchanged columns (e.g. the boundary) can be left out of live updates, so merge instead of replace
          const patch = Object.fromEntries(Object.entries(p.new).filter(([, v]) => v !== undefined));
          set((s) => ({ game: { ...(s.game || {}), ...patch } }));
        })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_players', filter }, loadPlayers)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_players', filter }, (p) =>
        set((s) => ({ players: s.players.map((x) => (x.id === p.new.id ? { ...x, ...Object.fromEntries(Object.entries(p.new).filter(([, v]) => v !== undefined)), profile: x.profile } : x)) })))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'game_players' }, loadPlayers)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'player_locations', filter }, (p) =>
        set((s) => ({ locations: { ...s.locations, [p.new.user_id]: p.new } })))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'player_locations', filter }, (p) =>
        set((s) => ({ locations: { ...s.locations, [p.new.user_id]: p.new } })))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'player_locations' }, (p) => {
        if (p.old?.game_id !== gameId) return;
        set((s) => { const l = { ...s.locations }; delete l[p.old.user_id]; return { locations: l }; });
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tag_requests', filter }, loadRequests)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tag_history', filter }, (p) =>
        set((s) => ({ history: [...s.history, p.new] })))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_events', filter }, (p) => {
        if (seen.current.has(p.new.id)) return;
        seen.current.add(p.new.id);
        onEventRef.current?.(p.new);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { set({ connected: true }); if (once.current) reload(); once.current = true; }
        else if (['CHANNEL_ERROR', 'TIMED_OUT'].includes(status)) {
          set({ connected: false });
          // rebuild the channel after a moment (also resyncs everything once it's back)
          if (!retryTimer) retryTimer = setTimeout(() => { once.current = true; setAttempt((a) => a + 1); }, 2000);
        } else if (status === 'CLOSED') set({ connected: false });
      });
    // While disconnected, poll so the game keeps working
    const poll = setInterval(() => { if (!ch.isJoined?.() && ch.state !== 'joined') reload(); }, 6000);
    const vis = () => document.visibilityState === 'visible' && reload();
    document.addEventListener('visibilitychange', vis);
    window.addEventListener('online', reload);
    return () => { clearTimeout(retryTimer); clearInterval(poll); document.removeEventListener('visibilitychange', vis); window.removeEventListener('online', reload); supabase.removeChannel(ch); };
  }, [gameId, attempt]);

  // New IT ping → fetch the snapshot (no notification, the map just updates)
  useEffect(() => { if (gameId && st.game?.last_ping_at) loadPings(); }, [st.game?.last_ping_at]);
  // Who's IT changed → what we're allowed to see live changed too
  const itKey = st.players.filter((p) => p.is_it).map((p) => p.user_id).sort().join(',');
  const firstIt = useRef(true);
  useEffect(() => { if (firstIt.current) { firstIt.current = false; return; } if (gameId) loadLocations(); }, [itKey]);

  const byUser = useMemo(() => new Map(st.players.map((p) => [p.user_id, p])), [st.players]);
  return { ...st, reload, playerOf: (id) => (id ? byUser.get(id) : undefined), profileOf: (id) => (id ? byUser.get(id)?.profile : undefined) };
}

const MIN_INTERVAL_MS = 2000, MIN_MOVE_M = 4, HEARTBEAT_MS = 15000;
/** Streams GPS to report_location() while enabled, throttled; keeps the screen awake. */
function useLocationSharing(gameId, enabled) {
  const [st, setSt] = useState({ permission: 'unknown', position: null, lastFixAt: null, lastSentAt: null, report: null, offline: false, wakeLock: false });
  const set = (p) => setSt((s) => ({ ...s, ...p }));
  const latest = useRef(null), lastSent = useRef(null), inFlight = useRef(false);

  const send = useCallback(async (force = false) => {
    const pos = latest.current;
    if (!gameId || !pos || inFlight.current) return;
    const now = Date.now(), prev = lastSent.current;
    if (!force && prev) {
      const el = now - prev.at, moved = distanceM(prev.pos, pos);
      const accBetter = prev.acc != null && pos.accuracy != null && prev.acc - pos.accuracy > 10;
      if (el < MIN_INTERVAL_MS || (moved < MIN_MOVE_M && !accBetter && el < HEARTBEAT_MS)) return;
    }
    inFlight.current = true;
    try {
      const { data, error } = await supabase.rpc('report_location', {
        g: gameId, lat: pos.latitude, lng: pos.longitude, acc: pos.accuracy, hdg: pos.heading, spd: pos.speed,
      });
      if (error) throw error;
      lastSent.current = { at: now, pos, acc: pos.accuracy };
      set({ report: data, lastSentAt: now, offline: false });
    } catch { set({ offline: true }); }
    finally { inFlight.current = false; }
  }, [gameId]);

  useEffect(() => {
    if (!enabled || !gameId) return;
    if (!navigator.geolocation) { set({ permission: 'denied' }); return; }
    const id = navigator.geolocation.watchPosition(
      (p) => {
        const c = p.coords;
        latest.current = { latitude: c.latitude, longitude: c.longitude, accuracy: c.accuracy ?? null,
          heading: Number.isFinite(c.heading) ? c.heading : null, speed: Number.isFinite(c.speed) ? c.speed : null };
        set({ permission: 'granted', position: latest.current, lastFixAt: Date.now() });
        send();
      },
      (err) => { if (err.code === 1) set({ permission: 'denied' }); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 },
    );
    const timer = setInterval(() => send(), 5000);

    // Keep the screen on — the web can't track location while the phone is locked.
    let lock = null, alive = true;
    const acquire = async () => {
      try { if ('wakeLock' in navigator && document.visibilityState === 'visible') { lock = await navigator.wakeLock.request('screen'); if (alive) set({ wakeLock: true }); lock.addEventListener('release', () => alive && set({ wakeLock: false })); } } catch {}
    };
    acquire();
    const vis = () => { if (document.visibilityState === 'visible') { acquire(); send(true); } };
    document.addEventListener('visibilitychange', vis);
    return () => { alive = false; navigator.geolocation.clearWatch(id); clearInterval(timer); document.removeEventListener('visibilitychange', vis); lock?.release?.().catch(() => {}); };
  }, [enabled, gameId, send]);

  return { ...st, sendNow: () => send(true) };
}

// ---------------------------------------------------------------- Leaflet helpers
const TILES = {
  dark: { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '© OpenStreetMap contributors', cls: 'tiles-dark' },
  streets: { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: '© OpenStreetMap contributors' },
  satellite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: 'Imagery © Esri' },
};
/** Create a Leaflet map in a div ref; returns the map once ready. Tile layer follows prefs.mapType. */
function useLeafletMap(ref, { center, zoom = 15, bounds, interactive = true } = {}) {
  const [map, setMap] = useState(null);
  const prefs = useStore(prefsStore);
  const tiles = useRef(null);
  useEffect(() => {
    const m = L.map(ref.current, {
      zoomControl: false, attributionControl: true, dragging: interactive, scrollWheelZoom: interactive,
      touchZoom: interactive, doubleClickZoom: interactive, boxZoom: false, keyboard: false, tap: interactive,
    });
    if (bounds?.length >= 2) m.fitBounds(L.latLngBounds(bounds.map(toLL)), { padding: [30, 30] });
    else m.setView(center ? toLL(center) : [40.7128, -74.006], zoom);
    setMap(m);
    const ro = new ResizeObserver(() => m.invalidateSize()); ro.observe(ref.current);
    return () => { ro.disconnect(); m.remove(); };
  }, []);
  useEffect(() => {
    if (!map) return;
    const t = TILES[prefs.mapType] || TILES.dark;
    tiles.current?.remove();
    tiles.current = L.tileLayer(t.url, { attribution: t.attr, maxZoom: 19, className: t.cls || '' }).addTo(map);
  }, [map, prefs.mapType]);
  return map;
}

function avatarHtml(profile, size) {
  const url = safeUrl(profile?.avatar_url);
  const bg = /^#[0-9a-f]{3,8}$/i.test(profile?.avatar_color || '') ? profile.avatar_color : '#69121B';
  const inner = url ? `<img src="${esc(url)}" />` : `<span style="font-size:${size * 0.5}px">${esc(profile?.avatar_emoji || '🏃')}</span>`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg}">${inner}</div>`;
}
function markerColor(state, isMe, teamColor) {
  if (state === 'it') return C.it;
  if (['eliminated', 'inactive', 'left'].includes(state)) return C.gray;
  if (isMe) return C.me;
  return teamColor || C.player;
}
function playerIconHtml({ profile, state, isMe, teamColor, frozen, showName, pinged, stale }) {
  const it = state === 'it', color = markerColor(state, isMe, teamColor), size = it ? 40 : 34;
  const dim = state === 'inactive' || state === 'eliminated' || stale;
  return `<div class="pm ${pinged ? 'ping-fade' : ''}">${it ? '<div class="pulse"></div>' : ''}${pinged ? '<div class="ping-ring"></div>' : ''}<div class="pm-ring ${dim ? 'pm-dim' : ''}" style="border-color:${color};box-shadow:0 0 12px ${color}">${avatarHtml(profile, size)}</div>${it ? '<div class="pm-badge">IT</div>' : ''}${frozen ? '<div class="pm-frozen">🧊</div>' : ''}${showName ? `<div class="pm-name">${esc(isMe ? 'You' : profile?.username)}</div>` : ''}</div>`;
}

function vibrate(pattern) { if (prefsStore.get().haptics && navigator.vibrate) navigator.vibrate(pattern); }
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone === true;

// ====================================================================== SIGN IN
function SignIn() {
  const [mode, setMode] = useState('guest');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(null);

  const guest = async () => {
    setBusy('guest');
    try {
      const { error } = await supabase.auth.signInAnonymously();
      if (error) throw error;
      replace('/');
    } catch (e) { toast({ title: 'Could not start', body: errorMessage(e), tone: 'danger' }); }
    finally { setBusy(null); }
  };
  const submit = async () => {
    if (!email.includes('@') || password.length < 6) return toast({ title: 'Enter an email and a 6+ character password', tone: 'warning' });
    setBusy('email');
    try {
      if (mode === 'up') {
        const { data, error } = await supabase.auth.signUp({ email: email.trim(), password });
        if (error) throw error;
        if (!data.session) { toast({ title: 'Check your email to confirm, then sign in', tone: 'info' }); setMode('in'); return; }
      } else {
        const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
      }
      replace('/');
    } catch (e) { toast({ title: 'Sign in failed', body: errorMessage(e), tone: 'danger' }); }
    finally { setBusy(null); }
  };

  return html`<${Screen}>
    <div style="margin:40px 0 30px" class="center-col"><${Logo} radar /><p class="tagline">The whole town is the playground.</p></div>
    ${mode === 'guest' ? html`
      <${Button} big variant="it" title="PLAY NOW" icon="▶" loading=${busy === 'guest'} onClick=${guest} />
      <p class="small" style="text-align:center">No sign-up needed. Your player stays on this phone.</p>
      <${Button} variant="ghost" title="Use an email account instead" onClick=${() => setMode('in')} />
    ` : html`
      <${Segmented} value=${mode} onChange=${setMode} options=${[{ value: 'in', label: 'Sign in' }, { value: 'up', label: 'Create account' }]} />
      <div style="height:16px"></div>
      <${Field} label="Email" type="email" autocomplete="email" value=${email} onInput=${setEmail} placeholder="you@example.com" />
      <${Field} label="Password" type="password" value=${password} onInput=${setPassword} placeholder="••••••••" />
      <${Button} big variant="it" title=${mode === 'in' ? 'SIGN IN' : 'CREATE ACCOUNT'} loading=${busy === 'email'} onClick=${submit} />
      <${Button} variant="ghost" title="Back to quick play" onClick=${() => setMode('guest')} style="margin-top:8px" />
    `}
    <p class="small" style="text-align:center;margin-top:28px">Your location is only shared with players in a game you join, and only while that game is running.</p>
  <//>`;
}

// ====================================================================== PROFILE SETUP
function ProfileSetup() {
  const { session, profile } = useStore(authStore);
  const editing = !!profile;
  const [username, setUsername] = useState(profile?.username || '');
  const [emoji, setEmoji] = useState(profile?.avatar_emoji || AVATAR_EMOJIS[0]);
  const [color, setColor] = useState(profile?.avatar_color || AVATAR_COLORS[0]);
  const [photo, setPhoto] = useState(profile?.avatar_url || null);
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef();

  const pick = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setFile(f); setPreview(URL.createObjectURL(f));
  };
  const save = async () => {
    const uid = session?.user?.id; if (!uid) return;
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return toast({ title: 'Username: 3–20 letters, numbers or _', tone: 'warning' });
    setBusy(true);
    try {
      let avatar_url = photo;
      if (file) {
        const small = await shrinkImage(file);
        const path = `${uid}/avatar-${Date.now()}.jpg`;
        const { error } = await supabase.storage.from('avatars').upload(path, small, { contentType: 'image/jpeg', upsert: true });
        if (error) throw error;
        avatar_url = supabase.storage.from('avatars').getPublicUrl(path).data.publicUrl;
      }
      const fields = { username, avatar_emoji: emoji, avatar_color: color, avatar_url };
      const { error } = editing ? await supabase.from('profiles').update(fields).eq('id', uid) : await supabase.from('profiles').insert({ id: uid, ...fields });
      if (error) throw error.code === '23505' ? new Error('That username is taken') : error;
      await loadProfile();
      if (editing) back(); else replace(sessionStorage.getItem('gt:after-profile') || '/home');
      sessionStorage.removeItem('gt:after-profile');
    } catch (e) { toast({ title: 'Could not save', body: errorMessage(e), tone: 'danger' }); }
    finally { setBusy(false); }
  };

  const shown = { avatar_url: preview || photo, avatar_emoji: emoji, avatar_color: color };
  return html`<${Screen}>
    <${Header} title=${editing ? 'Edit profile' : 'Create your player'} noBack=${!editing} />
    <div class="center-col" style="margin:8px 0 18px">
      <${Avatar} profile=${shown} size=${110} ring=${C.me} />
      <div class="row mt12">
        <${Button} inline variant="secondary" icon="📷" title="Photo" onClick=${() => fileRef.current.click()} />
        ${(photo || preview) && html`<${Button} inline variant="ghost" title="Use emoji" onClick=${() => { setPhoto(null); setFile(null); setPreview(null); }} />`}
      </div>
      <input ref=${fileRef} type="file" accept="image/*" style="display:none" onChange=${pick} />
    </div>
    <${Field} label="Username" value=${username} onInput=${setUsername} maxlength="20" autocapitalize="off" autocorrect="off" placeholder="speedy_sam" hint="Shown to other players on the map." />
    <${Section}>Avatar<//>
    <div class="grid-pick">${AVATAR_EMOJIS.map((e) => html`<button class=${emoji === e ? 'on' : ''} onClick=${() => setEmoji(e)}>${e}</button>`)}</div>
    <${Section}>Colour<//>
    <div class="grid-pick">${AVATAR_COLORS.map((c) => html`<button class=${`swatch ${color === c ? 'on' : ''}`} style=${{ background: c }} onClick=${() => setColor(c)}></button>`)}</div>
    <${Button} big variant="it" title=${editing ? 'SAVE' : "LET'S PLAY"} loading=${busy} onClick=${save} style="margin-top:28px" />
  <//>`;
}

function shrinkImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = 320, c = document.createElement('canvas'); c.width = s; c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      c.toBlob((b) => resolve(b || file), 'image/jpeg', 0.8);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

function Home() {
  const { profile } = useStore(authStore);
  const [rows, setRows] = useState([]);
  useEffect(() => {
    if (!profile) return;
    supabase.from('game_players').select('game_id, role, is_winner, final_rank, left_at, games(*)')
      .eq('user_id', profile.id).order('joined_at', { ascending: false }).limit(25)

  }, [profile?.id]);
  const live = rows.filter((r) => ['lobby', 'countdown', 'active', 'paused'].includes(r.games.status) && !r.left_at);

  return html`<${Screen}>
    <div class="row" style="justify-content:space-between">
      <button class="icon-btn" onClick=${() => go('/settings')}>⚙️</button>
      <button class="row" style="background:var(--card);border-radius:999px;padding:4px 4px 4px 14px" onClick=${() => go('/profile')}>
        <b>${profile?.username}</b><${Avatar} profile=${profile} size=${36} ring=${C.me} />
      </button>
    </div>
    <div style="margin:26px 0 30px"><${Logo} radar /></div>
    <div class="gap12">
      <${Button} big variant="it" icon="➕" title="CREATE GAME" onClick=${() => { draftStore.replace({ ...DEFAULT_SETTINGS }); go('/create'); }} />
      <${Button} big icon="🎟️" title="JOIN GAME" onClick=${() => go('/join')} />
      <${Button} variant="secondary" icon="👤" title="My profile & stats" onClick=${() => go('/profile')} />
    </div>
    ${isIOS && !isStandalone && html`<div class="a2hs">
      <b>📲 Add GIANT TAG to your home screen</b>
      <div class="small" style="color:#cbd5e1;margin-top:4px">In Safari tap <b>Share</b> (the square with an arrow) → <b>Add to Home Screen</b>. It opens full-screen like a real app.</div>
    </div>`}
    ${live.length > 0 && html`<${Section}>Happening now<//>${live.map((r) => html`<${GameRow} row=${r} />`)}`}
    <${Section}>Previous games<//>
    ${past.length ? past.map((r) => html`<${GameRow} row=${r} />`) : html`<${Card}><span class="muted">No games yet. Create one and send the code to your friends!</span><//>`}
  <//>`;
}
function GameRow({ row }) {

  return html`<div class="list-row tap" onClick=${() => go(gamePath(g))}>
    <span style="font-size:28px">${MODE_INFO[g.mode].emoji}</span>
    <div class="grow"><div class="h2 ellipsis">${g.name}</div>
      <div class="small">${MODE_INFO[g.mode].title} · ${new Date(g.created_at).toLocaleDateString()}${g.location_name ? ' · ' + g.location_name : ''}</div></div>

      ? row.is_winner ? html`<${Pill} color=${C.boundary} text=${C.cherry}>🏆 WON<//>` : row.final_rank ? html`<${Pill}>#${row.final_rank}<//>` : null
      : html`<${Pill} color=${g.status === 'lobby' ? C.player : C.it}>${g.status === 'lobby' ? 'IN LOBBY' : 'LIVE'}<//>`}

}

function CreateGame() {

    setBusy(true);
    try { const id = await rpc('create_game', { settings: d }); replace(`/g/${id}/lobby`); }
    catch (e) { toast({ title: 'Could not create game', body: e.message, tone: 'danger' }); }
    finally { setBusy(false); }
  };
  return html`<${Screen}><${Header} title="Create game" /><${SettingsForm} />
    <${Button} big variant="it" icon="🚩" title="CREATE LOBBY" loading=${busy} onClick=${create} style="margin-top:28px" /><//>`;
}

function EditGame({ id }) {
  const [busy, setBusy] = useState(false);
