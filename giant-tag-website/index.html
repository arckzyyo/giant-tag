// ====================================================================== BOUNDARY EDITOR
function BoundaryEditor({ gameId }) {
  const draft = draftStore.get();
  const ref = useRef();
  const map = useLeafletMap(ref, { bounds: draft.boundary, zoom: 15 });
  const [points, setPoints] = useState(draft.boundary);
  const [zones, setZones] = useState(draft.safe_zones);
  const [name, setName] = useState(draft.location_name || '');
  const [hist, setHist] = useState([]);
  const [mode, setMode] = useState('draw');
  const [sel, setSel] = useState(null);
  const [selZone, setSelZone] = useState(null);
  const [zoneR, setZoneR] = useState(40);
  const [q, setQ] = useState('');
  const [searching, setSearching] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedOpen, setSavedOpen] = useState(false);
  const [saveAsOpen, setSaveAsOpen] = useState(false);
  const layers = useRef(null);
  const st = useRef({}); st.current = { points, zones, mode, sel, selZone, zoneR };

  const snapshot = () => setHist((h) => [...h.slice(-30), { points: st.current.points, zones: st.current.zones }]);

  // Start at the user's location if there's no boundary yet
  useEffect(() => {
    if (!map || draft.boundary.length) return;
    navigator.geolocation?.getCurrentPosition((p) => map.setView([p.coords.latitude, p.coords.longitude], 15), () => {}, { timeout: 8000 });
  }, [map]);

  useEffect(() => {
    if (!map) return;
    layers.current = L.layerGroup().addTo(map);
    map.on('click', (e) => {
      const s = st.current;
      if (s.sel !== null || s.selZone) { setSel(null); setSelZone(null); return; }
      snapshot();
      const c = fromLL(e.latlng);
      if (s.mode === 'draw') setPoints((p) => [...p, c]);
      else setZones((z) => [...z, { id: Math.random().toString(36).slice(2, 10), name: `Safe zone ${z.length + 1}`, radius: s.zoneR, ...c }]);
    });
  }, [map]);

  // Redraw
  const maxR = draft.max_radius_m;
  const centre = useMemo(() => centroid(points), [points]);
  const tooBig = maxR != null && points.length >= 3 && maxDistanceFromCentre(points) > maxR;
  useEffect(() => {
    if (!map || !layers.current) return;
    const g = layers.current; g.clearLayers();
    if (points.length >= 3) L.polygon(points.map(toLL), { color: tooBig ? C.danger : C.boundary, weight: 4, fillOpacity: 0.1, interactive: false }).addTo(g);
    else if (points.length === 2) L.polyline(points.map(toLL), { color: C.boundary, weight: 4, interactive: false }).addTo(g);
    if (maxR != null && centre && points.length >= 3) L.circle(toLL(centre), { radius: maxR, color: C.powder, weight: 1.5, opacity: 0.5, dashArray: '8 8', fill: false, interactive: false }).addTo(g);
    points.forEach((p, i) => {
      const m = L.marker(toLL(p), { draggable: true, icon: L.divIcon({ className: '', html: `<div class="vertex ${sel === i ? 'sel' : ''}">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(g);
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); setSel(i); setSelZone(null); });
      m.on('dragstart', snapshot);
      m.on('dragend', () => { const c = fromLL(m.getLatLng()); setPoints((pts) => pts.map((x, j) => (j === i ? c : x))); });
    });
    zones.forEach((z) => {
      L.circle(toLL(z), { radius: z.radius, color: C.safe, weight: 2, fillOpacity: 0.18, interactive: false }).addTo(g);
      const m = L.marker(toLL(z), { draggable: true, icon: L.divIcon({ className: '', html: `<div class="safe-mk ${selZone === z.id ? 'sel' : ''}">🛡️</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(g);
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); setSelZone(z.id); setSel(null); });
      m.on('dragstart', snapshot);
      m.on('dragend', () => { const c = fromLL(m.getLatLng()); setZones((zs) => zs.map((x) => (x.id === z.id ? { ...x, ...c } : x))); });
    });
  }, [map, points, zones, sel, selZone, tooBig]);

  const search = async () => {
    if (!q.trim()) return;
    setSearching(true);
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q.trim())}`).then((x) => x.json());
      if (!r.length) return toast({ title: `Couldn't find "${q}"`, body: 'Try adding a state or country.', tone: 'warning' });
      const b = r[0].boundingbox?.map(Number);
      if (b) map.fitBounds([[b[0], b[2]], [b[1], b[3]]], { maxZoom: 16 }); else map.setView([+r[0].lat, +r[0].lon], 15);
      if (!name) setName(q.trim());
      document.activeElement?.blur();
    } catch (e) { toast({ title: 'Search failed', body: errorMessage(e), tone: 'danger' }); }
    finally { setSearching(false); }
  };
  const locate = () => navigator.geolocation?.getCurrentPosition(
    (p) => map.setView([p.coords.latitude, p.coords.longitude], 16),
    () => toast({ title: 'Allow location access to jump to where you are', tone: 'warning' }), { enableHighAccuracy: true, timeout: 10000 });
  const undo = () => { const last = hist[hist.length - 1]; if (!last) return; setPoints(last.points); setZones(last.zones); setHist((h) => h.slice(0, -1)); setSel(null); setSelZone(null); };
  const reset = () => { if (confirm('Clear all boundary points and safe zones?')) { snapshot(); setPoints([]); setZones([]); setSel(null); } };
  const insertAfter = () => {
    if (sel === null || points.length < 2) return; snapshot();
    const a = points[sel], b = points[(sel + 1) % points.length];
    const next = [...points]; next.splice(sel + 1, 0, { latitude: (a.latitude + b.latitude) / 2, longitude: (a.longitude + b.longitude) / 2 });
    setPoints(next); setSel(sel + 1);
  };
  const delSel = () => { if (sel === null) return; snapshot(); setPoints((p) => p.filter((_, i) => i !== sel)); setSel(null); };
  const zoneSel = zones.find((z) => z.id === selZone);
  const resizeZone = (d) => setZones((zs) => zs.map((x) => (x.id === selZone ? { ...x, radius: Math.min(500, Math.max(10, x.radius + d)) } : x)));

  const done = async () => {
    if (points.length > 0 && points.length < 3) return toast({ title: 'A boundary needs at least 3 points', tone: 'warning' });
    if (tooBig) return toast({ title: `Boundary must fit within ${formatDistance(maxR)} radius`, tone: 'warning' });
    let locName = name.trim() || null;
    if (!locName && centre) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=14&lat=${centre.latitude}&lon=${centre.longitude}`).then((x) => x.json());
        const a = r.address || {};
        locName = [a.city || a.town || a.village || a.suburb || a.county, a.state].filter(Boolean).join(', ') || null;
      } catch {}
    }
    const patch = { boundary: points, safe_zones: zones, location_name: locName };
    draftStore.set(patch);
    if (gameId) {
      setSaving(true);
      try { await rpc('update_game_settings', { g: gameId, settings: patch }); }
      catch (e) { setSaving(false); return toast({ title: 'Could not save', body: e.message, tone: 'danger' }); }
      setSaving(false);
    }
    back();
  };

  const loadSaved = (b) => {
    snapshot(); setPoints(b.points); setZones(b.safe_zones || []); if (b.location_name) setName(b.location_name); setSavedOpen(false);
    if (b.points.length) map.fitBounds(L.latLngBounds(b.points.map(toLL)), { padding: [40, 40] });
  };

  return html`<div class="full">
    <div class="map" ref=${ref}></div>
    <div class="hud-top">
      <div class="row">
        <button class="round glass" onClick=${() => back()}>✕</button>
        <div class="search glass">
          <span>🔎</span>
          <input value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Search a town, city or address" enterkeyhint="search"
            onKeyDown=${(e) => e.key === 'Enter' && search()} />
          ${searching && html`<div class="spinner" style="width:18px;height:18px;border-width:2px"></div>`}
        </div>
      </div>
      <div class="pills">
        <span class="pill">${points.length} points</span>
        ${points.length >= 3 && html`<span class="pill">${areaKm2(points).toFixed(2)} km²</span>`}
        ${zones.length > 0 && html`<span class="pill">🛡️ ${zones.length} safe</span>`}
        ${tooBig && html`<span class="pill" style="background:var(--danger)">Exceeds max radius</span>`}
      </div>
      <div class="tip glass">${mode === 'draw' ? (sel !== null ? 'Drag the point to move it, or use the buttons below.' : 'Tap the map to add boundary points. Drag points to adjust.') : 'Tap the map to drop a safe zone. Players inside can’t be tagged.'}</div>
    </div>
    <div class="side-btns" style="position:absolute;right:12px;top:calc(var(--st) + 160px);z-index:1000">
      <button class="round glass" onClick=${locate} title="My location">📍</button>
      <button class="round glass" onClick=${undo} disabled=${!hist.length} style=${{ opacity: hist.length ? 1 : 0.35 }}>↩️</button>
      <button class="round glass" onClick=${reset}>🗑️</button>
      <button class="round glass" onClick=${() => setSavedOpen(true)} title="Load saved">📂</button>
      <button class="round glass" onClick=${() => points.length >= 3 && setSaveAsOpen(true)} style=${{ opacity: points.length >= 3 ? 1 : 0.35 }} title="Save for later">🔖</button>
    </div>
    <div class="editor-bottom glass">
      ${sel !== null && html`<div class="row" style="margin-bottom:10px">
        <b class="grow">Point ${sel + 1}</b>
        <${Button} inline variant="secondary" title="+ Insert after" onClick=${insertAfter} />
        <${Button} inline variant="danger" title="Delete" onClick=${delSel} />
      </div>`}
      ${zoneSel && html`<div class="row" style="margin-bottom:10px">
        <b class="grow">Safe zone · ${zoneSel.radius} m</b>
        <${Button} inline variant="secondary" title="−" onClick=${() => resizeZone(-10)} />
        <${Button} inline variant="secondary" title="+" onClick=${() => resizeZone(10)} />
        <${Button} inline variant="danger" title="Delete" onClick=${() => { snapshot(); setZones((zs) => zs.filter((x) => x.id !== selZone)); setSelZone(null); }} />
      </div>`}
      <div class="mode-row">
        <button class=${mode === 'draw' ? 'b-on' : ''} onClick=${() => setMode('draw')}>〰️ Boundary</button>
        <button class=${mode === 'safe' ? 's-on' : ''} onClick=${() => setMode('safe')}>🛡️ Safe zones</button>
      </div>
      ${mode === 'safe' && html`<div class="row" style="margin-bottom:10px">
        <span class="muted grow">New zone radius: ${zoneR} m</span>
        <${Button} inline variant="secondary" title="−" onClick=${() => setZoneR((r) => Math.max(10, r - 10))} />
        <${Button} inline variant="secondary" title="+" onClick=${() => setZoneR((r) => Math.min(500, r + 10))} />
      </div>`}
      <${Field} value=${name} onInput=${setName} maxlength="60" placeholder="Area name (e.g. Springfield downtown)" />
      <${Button} big variant="it" icon="✅" title=${gameId ? 'SAVE BOUNDARY' : 'USE THIS BOUNDARY'} loading=${saving} onClick=${done} />
    </div>
    <${SavedBoundaries} open=${savedOpen} onClose=${() => setSavedOpen(false)} onPick=${loadSaved} />
    <${SaveAs} open=${saveAsOpen} onClose=${() => setSaveAsOpen(false)} points=${points} zones=${zones} locName=${name} />
  </div>`;
}

function SavedBoundaries({ open, onClose, onPick }) {
  const [items, setItems] = useState(null);
  useEffect(() => { if (open) supabase.from('saved_boundaries').select('*').order('created_at', { ascending: false }).then(({ data }) => setItems(data || [])); }, [open]);
  const del = async (id, e) => { e.stopPropagation(); await supabase.from('saved_boundaries').delete().eq('id', id); setItems((x) => x.filter((b) => b.id !== id)); };
  return html`<${Sheet} open=${open} onClose=${onClose} title="Saved boundaries">
    ${items === null ? html`<div class="spinner"></div>` : items.length === 0 ? html`<div class="muted">Nothing saved yet. Use 🔖 to save a boundary.</div>` :
      items.map((b) => html`<div class="list-row tap" onClick=${() => onPick(b)}>
        <div class="grow"><b>${b.name}</b><div class="small">${b.points.length} points · ${areaKm2(b.points).toFixed(2)} km² · ${(b.safe_zones || []).length} safe zones</div></div>
        <button onClick=${(e) => del(b.id, e)}>🗑️</button></div>`)}
    <${Button} variant="secondary" title="Close" onClick=${onClose} style="margin-top:12px" />
  <//>`;
}
function SaveAs({ open, onClose, points, zones, locName }) {
  const [n, setN] = useState(locName);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (open) setN(locName); }, [open]);
  const save = async () => {
    if (!n.trim()) return; setBusy(true);
    const { error } = await supabase.from('saved_boundaries').insert({ name: n.trim().slice(0, 40), points, safe_zones: zones, location_name: locName || null });
    setBusy(false);
    if (error) return toast({ title: 'Could not save', body: error.message, tone: 'danger' });
    toast({ title: 'Boundary saved for future games', tone: 'success' }); onClose();
  };
  return html`<${Sheet} open=${open} onClose=${onClose} title="Save boundary for later">
    <${Field} value=${n} onInput=${setN} placeholder="Name" maxlength="40" /><${Button} variant="it" title="Save" loading=${busy} onClick=${save} />
  <//>`;
}

// ====================================================================== JOIN
function Join({ code: initial }) {
  const [code, setCode] = useState((initial || '').toUpperCase());
  const [busy, setBusy] = useState(null);
  const auto = useRef(false);
  const join = async (spectator = false) => {
    const c = code.trim().toUpperCase();
    if (c.length !== 6) return toast({ title: 'Game codes are 6 characters', tone: 'warning' });
    setBusy(spectator ? 's' : 'p');
    try { const id = await rpc('join_game', { join_code: c, as_spectator: spectator }); replace(`/g/${id}/lobby`); }
    catch (e) { toast({ title: 'Could not join', body: e.message, tone: 'danger' }); }
    finally { setBusy(null); }
  };
  useEffect(() => { if (initial && !auto.current) { auto.current = true; join(false); } }, []);
  return html`<${Screen}>
    <${Header} title="Join game" onBack=${() => replace('/home')} />
    <p class="muted" style="text-align:center;margin-top:20px">Enter the code from the host</p>
    <input class="code-input" value=${code} maxlength="6" autocapitalize="characters" autocorrect="off" autocomplete="off" placeholder="ABC123"
      onInput=${(e) => setCode(e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6))} onKeyDown=${(e) => e.key === 'Enter' && join()} />
    <${Button} big variant="it" icon="🎟️" title="JOIN" loading=${busy === 'p'} onClick=${() => join(false)} />
    <${Button} variant="secondary" icon="👀" title="Watch as spectator" loading=${busy === 's'} onClick=${() => join(true)} style="margin-top:12px" />
    <p class="small mt24">Spectators watch the live map without sharing their location. Games that already started can only be joined as a spectator.</p>
  <//>`;
}

// ====================================================================== LOBBY
const OOB_LABEL = { become_it: 'Become IT', warn: 'Warning only', pause: 'Freeze', disqualify: 'Disqualified' };
function Lobby({ id }) {
  const { profile } = useStore(authStore);
  const g = useGame(id, (e) => {
    if (e.kind === 'kicked') { toast({ title: 'The host removed you from the lobby', tone: 'danger' }); replace('/home'); }
    else if (['join', 'leave', 'rejoin'].includes(e.kind)) toast({ title: e.title, tone: 'info' });
  });
  const [busy, setBusy] = useState(null);
  const [consent, setConsent] = useState(false);
  const [menuFor, setMenuFor] = useState(null);
  const game = g.game;
  const me = g.playerOf(profile?.id);
  const isHost = game?.host_id === profile?.id;

  useEffect(() => {
    if (!game) return;
    if (['countdown', 'active', 'paused', 'finished'].includes(game.status)) replace(gamePath(game));
    else if (game.status === 'cancelled') { toast({ title: 'The host closed this lobby', tone: 'warning' }); replace('/home'); }
  }, [game?.status]);

  if (g.loading || !game) return html`<${Loading} label=${g.error || 'Loading lobby…'} />`;

  const players = g.players.filter((p) => p.role === 'player' && !p.left_at);
  const spectators = g.players.filter((p) => p.role === 'spectator' && !p.left_at);
  const ready = players.filter((p) => p.is_ready || p.user_id === game.host_id).length;
  const canStart = players.length >= 2 && ready === players.length && game.boundary.length >= 3;
  const invite = `${location.origin}${location.pathname}#/join?code=${game.code}`;

  const run = async (k, fn) => { setBusy(k); try { await fn(); } catch (e) { toast({ title: e.message, tone: 'danger' }); } finally { setBusy(null); } };
  const share = async () => {
    const text = `Join my GIANT TAG game "${game.name}"! Code: ${game.code}`;
    if (navigator.share) { try { await navigator.share({ title: 'GIANT TAG', text, url: invite }); } catch {} }
    else { await navigator.clipboard?.writeText(`${text}\n${invite}`); toast({ title: 'Invite link copied', tone: 'success' }); }
  };
  const toggleReady = () => {
    if (!me.is_ready && !me.consented_at) return setConsent(true);
    run('ready', () => rpc('set_ready', { g: game.id, ready: !me.is_ready }));
  };
  const accept = () => {
    setConsent(false);
    navigator.geolocation.getCurrentPosition(
      () => run(isHost ? 'start' : 'ready', () => isHost ? rpc('start_game', { g: game.id }) : rpc('set_ready', { g: game.id, ready: true, location_consent: true })),
      () => toast({ title: 'Location is blocked', body: 'iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using.', tone: 'danger' }),
      { enableHighAccuracy: true, timeout: 15000 });
  };
  const leave = () => {
    if (!confirm(isHost ? 'Cancel this game for everyone?' : 'Leave this lobby?')) return;
    run('leave', async () => { await rpc('leave_game', { g: game.id }); replace('/home'); });
  };
  const startingIt = game.starting_it_id ? g.profileOf(game.starting_it_id)?.username : null;

  return html`<${Screen}>
    <${Header} title="Lobby" onBack=${() => replace('/home')} right=${html`<button class="icon-btn" onClick=${leave} title="Leave">🚪</button>`} />
    <h1 class="h1" style="text-align:center">${game.name}</h1>
    <p class="muted" style="text-align:center;margin:4px 0 0">${MODE_INFO[game.mode].emoji} ${MODE_INFO[game.mode].title} · hosted by ${g.profileOf(game.host_id)?.username}</p>
    <div class="code-box" onClick=${() => { navigator.clipboard?.writeText(game.code); toast({ title: 'Code copied', tone: 'success' }); }}>
      <div class="small">GAME CODE · tap to copy</div><div class="code-big">${game.code}</div>
    </div>
    <${Button} variant="secondary" icon="📤" title="Invite friends" onClick=${share} />
    ${game.boundary.length >= 3 && html`<${MiniMap} game=${game} />`}

    <${Section} right=${html`<${Pill} color=${canStart ? C.amber : C.card2} text=${canStart ? C.cherry : C.powder}>${ready}/${players.length} ready<//>`}>Players · ${players.length}/${game.max_players}<//>
    ${players.map((p) => {
      const r = p.is_ready || p.user_id === game.host_id;
      return html`<div class="list-row tap" onClick=${() => isHost && p.user_id !== profile.id && setMenuFor(p)}>
        <${Avatar} profile=${p.profile} size=${42} ring=${p.user_id === profile?.id ? C.me : null} />
        <div class="grow"><b>${p.profile?.username}${p.user_id === profile?.id ? ' (you)' : ''}</b>
          <div class="small">${p.user_id === game.host_id ? '👑 Host' : 'Player'}${game.starting_it_id === p.user_id ? ' · 🔴 Starts as IT' : ''}</div></div>
        <${Pill} color=${r ? C.amber : C.card2} text=${r ? C.cherry : C.muted}>${r ? 'READY' : 'NOT READY'}<//>
      </div>`;
    })}
    ${spectators.length > 0 && html`<div class="small mt8">👀 Spectators: ${spectators.map((s) => s.profile?.username).join(', ')}</div>`}

    <${Section} right=${isHost && html`<button style="color:var(--player);font-weight:700" onClick=${() => { draftStore.replace(settingsOf(game)); go(`/g/${game.id}/edit`); }}>Edit</button>`}>Game settings<//>
    <${Card}>
      ${[
        ['Duration', formatDuration(game.duration_seconds)],
        ['Head start', game.countdown_seconds ? game.countdown_seconds + 's' : 'None'],
        game.mode !== 'team' && ['Starting IT', startingIt || 'Random'],
        ['Auto-tag distance', game.tag_radius_m + ' m'],
        game.mode !== 'team' && ['IT ↔ runners', game.it_ping_seconds ? `Ping every ${game.it_ping_seconds >= 60 ? game.it_ping_seconds / 60 + ' min' : game.it_ping_seconds + 's'}` : 'Live'],
        ['Speed limit', game.speed_limit_mph ? `${game.speed_limit_mph} mph → become IT` : 'Off'],
        ['Out of bounds', `${OOB_LABEL[game.out_of_bounds_action]} after ${game.grace_seconds}s`],
        ['Safe zones', String(game.safe_zones.length)],
        ['Rejoin', game.allow_rejoin ? 'Allowed' : 'Off'],
      ].filter(Boolean).map(([k, v]) => html`<div class="row" style="justify-content:space-between;padding:3px 0"><span class="muted">${k}</span><b>${v}</b></div>`)}
    <//>

    <div class="gap12 mt24">
      ${me?.role === 'player' && !isHost && html`<${Button} big variant=${me.is_ready ? 'secondary' : 'it'} icon=${me.is_ready ? '✋' : '✅'}
        title=${me.is_ready ? "I'M NOT READY" : "I'M READY"} loading=${busy === 'ready'} onClick=${toggleReady} />`}
      ${isHost && html`
        <${Button} big variant="it" icon="▶" title="START GAME" disabled=${!canStart} loading=${busy === 'start'}
          onClick=${() => (me.consented_at ? run('start', () => rpc('start_game', { g: game.id })) : setConsent(true))} />
        ${!canStart && html`<p class="small" style="text-align:center">${players.length < 2 ? 'Waiting for at least one more player…' : game.boundary.length < 3 ? 'Draw a boundary first (Edit).' : 'Waiting for everyone to be ready…'}</p>`}`}
      ${me?.role === 'spectator' && html`<p class="muted" style="text-align:center">You're spectating. Sit tight until the host starts.</p>`}
    </div>

    <${Modal} open=${consent}>
      <div style="font-size:40px;text-align:center">📍</div>
      <h2 class="h2" style="text-align:center;margin:8px 0">Share your location for this game?</h2>
      <div class="muted" style="line-height:1.6">
        • Only the people in “${game.name}” can see you.<br/>
        • Sharing starts when the game starts and stops when it ends or you leave.<br/>
        • A green LIVE badge shows whenever you're sharing.<br/>
        • Keep GIANT TAG open on screen during the game. Your phone can't share location while locked.
      </div>
      <${Button} variant="success" title=${isHost ? 'I agree, start the game' : "I agree, I'm ready"} onClick=${accept} style="margin-top:18px" />
      <${Button} variant="ghost" title="Not now" onClick=${() => setConsent(false)} style="margin-top:6px" />
    <//>
    <${Sheet} open=${!!menuFor} onClose=${() => setMenuFor(null)} title=${menuFor?.profile?.username}>
      <div class="gap8">
        <${Button} variant="secondary" title="🔴 Make starting IT" onClick=${() => { const p = menuFor; setMenuFor(null); run('menu', () => rpc('update_game_settings', { g: game.id, settings: { starting_it_id: p.user_id } })); }} />
        <${Button} variant="danger" title="Remove from lobby" onClick=${() => { const p = menuFor; setMenuFor(null); run('menu', () => rpc('kick_player', { g: game.id, target: p.user_id })); }} />
      </div>
    <//>
  <//>`;
}

function MiniMap({ game }) {
  const ref = useRef();
  const map = useLeafletMap(ref, { bounds: game.boundary, interactive: false });
  useEffect(() => {
    if (!map) return;
    const g = L.layerGroup().addTo(map);
    L.polygon(game.boundary.map(toLL), { color: C.boundary, weight: 3, fillOpacity: 0.1 }).addTo(g);
    game.safe_zones.forEach((z) => L.circle(toLL(z), { radius: z.radius, color: C.safe, weight: 2, fillOpacity: 0.18 }).addTo(g));
    map.fitBounds(L.latLngBounds(game.boundary.map(toLL)), { padding: [20, 20] });
    return () => g.remove();
  }, [map, game.boundary, game.safe_zones]);
  return html`<div class="mini-map"><div class="map" ref=${ref}></div>
    <div class="mini-label">📍 ${game.location_name || 'Playing area'} · ${areaKm2(game.boundary).toFixed(2)} km²</div></div>`;
}

// ====================================================================== PLAYERS
function Players({ id }) {
  const { profile } = useStore(authStore);
  const g = useGame(id);
  const now = useNow(1000);
  const game = g.game;
  if (g.loading || !game) return html`<${Loading} />`;
  const rows = g.players.map((p) => ({ p, st: playerState(p, g.locations[p.user_id], game, now) }));
  const sections = [
    [game.mode === 'classic' ? 'IT' : 'IT team', rows.filter((x) => x.st === 'it')],
    ['Active players', rows.filter((x) => x.st === 'active' || x.st === 'inactive')],
    ['Eliminated', rows.filter((x) => x.st === 'eliminated')],
    ['Spectators', rows.filter((x) => x.st === 'spectator')],
    ['Left the game', rows.filter((x) => x.st === 'left')],
  ].filter(([, r]) => r.length);
  return html`<${Screen}>
    <${Header} title=${`Players · ${g.players.filter((p) => p.role === 'player' && !p.left_at).length}`} />
    ${sections.map(([title, list]) => html`<${Section}>${title} · ${list.length}<//>
      ${list.map(({ p, st }) => {
        const ring = st === 'it' ? C.it : p.user_id === profile?.id ? C.me : game.mode === 'team' && p.team ? TEAM_INFO[p.team].color : null;
        return html`<div class="list-row" style=${st === 'it' ? { borderColor: C.it } : null}>
          <${Avatar} profile=${p.profile} size=${46} ring=${ring} dim=${['eliminated', 'left', 'inactive'].includes(st)} />
          <div class="grow"><b>${p.profile?.username}${p.user_id === profile?.id ? ' (you)' : ''}${p.user_id === game.host_id ? ' 👑' : ''}</b>
            <div class="small">${STATE_LABEL[st]}${p.role === 'player' && game.started_at ? ` · survived ${formatDuration(survivalSeconds(p, game, now))}` : ''}${p.tags_count ? ` · ${p.tags_count} tags` : ''}${st === 'inactive' ? ` · last seen ${timeAgo(g.locations[p.user_id]?.updated_at || p.last_seen_at, now)}` : ''}</div>
            ${(p.is_out_of_bounds || p.speed_warnings > 0) && html`<div class="small" style="color:var(--warning)">${p.is_out_of_bounds ? '🚧 Out of bounds ' : ''}${p.speed_warnings ? `🚗 ${p.speed_warnings} speed warning(s)` : ''}</div>`}
          </div>
          ${st === 'it' && html`<${Pill} color=${C.it}>IT<//>`}
          ${game.mode === 'team' && p.team && html`<${Pill} color=${TEAM_INFO[p.team].color}>${TEAM_INFO[p.team].name.split(' ')[1]}<//>`}
        </div>`;
      })}`)}
  <//>`;
}

// ====================================================================== RESULTS
const KIND_VERB = { transfer: 'tagged', infect: 'infected', eliminate: 'eliminated', capture: 'captured' };
function Results({ id }) {
  const { profile } = useStore(authStore);
  const g = useGame(id);
  const [trail, setTrail] = useState([]);
  const ref = useRef();
  useEffect(() => {
    if (!profile) return;
    supabase.from('location_history').select('latitude, longitude').eq('game_id', id).eq('user_id', profile.id).order('recorded_at')
      .then(({ data }) => setTrail(data || []));
  }, [id, profile?.id]);
  const game = g.game;
  if (g.loading || !game) return html`<${Loading} />`;

  const ranked = g.players.filter((p) => p.role === 'player').sort((a, b) => (a.final_rank ?? 999) - (b.final_rank ?? 999));
  const winners = ranked.filter((p) => p.is_winner);
  const me = ranked.find((p) => p.user_id === profile?.id);
  const tags = g.history.filter((h) => KIND_VERB[h.kind]);
  const longest = [...ranked].sort((a, b) => (b.survival_seconds || 0) - (a.survival_seconds || 0))[0];
  const duration = game.started_at && game.finished_at ? (new Date(game.finished_at) - new Date(game.started_at)) / 1000 - game.paused_seconds : 0;
  const title = game.status === 'cancelled' ? 'GAME CANCELLED' : game.winning_team ? `${TEAM_INFO[game.winning_team].name.toUpperCase()} WINS!`
    : winners.length === 1 ? `${(winners[0].profile?.username || '').toUpperCase()} WINS!` : winners.length > 1 ? `${winners.length} WINNERS!` : 'GAME OVER';
  const share = async () => {
    const text = `🏃 GIANT TAG — ${game.name}\n${title}\n` + ranked.slice(0, 5).map((p) => `#${p.final_rank} ${p.profile?.username} · ${formatDuration(p.survival_seconds)} survived · ${p.tags_count} tags`).join('\n');
    if (navigator.share) navigator.share({ text }).catch(() => {}); else { navigator.clipboard?.writeText(text); toast({ title: 'Results copied', tone: 'success' }); }
  };

  return html`<${Screen}>
    <div class="center-col" style="margin-top:16px">
      <div style="color:var(--it);font-size:18px;font-weight:900;font-style:italic;letter-spacing:4px">GAME OVER</div>
      <div style="font-size:64px;margin-top:8px">🏆</div>
      <h1 class="h1">${title}</h1>
      ${me?.is_winner && html`<${Pill} color=${C.boundary} text=${C.cherry} style=${{ marginTop: '8px' }}>YOU WON!<//>`}
      <div class="row mt16">${winners.slice(0, 5).map((w, i) => html`<${Avatar} profile=${w.profile} size=${56} ring=${C.boundary} style=${{ marginLeft: i ? '-22px' : 0 }} />`)}</div>
      <p class="muted">${MODE_INFO[game.mode].emoji} ${game.name}</p>
    </div>
    <div class="stats two mt16">
      <div class="stat"><div class="v">${formatDuration(duration)}</div><div class="small">Game length</div></div>
      <div class="stat"><div class="v">${tags.length}</div><div class="small">Total tags</div></div>
      <div class="stat"><div class="v">${g.history.filter((h) => h.kind !== 'auto_assign').length}</div><div class="small">IT changes</div></div>
      <div class="stat"><div class="v">${longest ? formatDuration(longest.survival_seconds) : '—'}</div><div class="small">Longest survival${longest ? ' · ' + longest.profile?.username : ''}</div></div>
    </div>
    <${Section}>Final rankings<//>
    ${ranked.map((p) => html`<div class="list-row" style=${p.user_id === profile?.id ? { borderColor: C.me } : null}>
      <b style="width:34px;color:var(--muted)">#${p.final_rank ?? '–'}</b>
      <${Avatar} profile=${p.profile} size=${40} />
      <div class="grow"><b>${p.profile?.username} ${p.is_winner ? '🏆' : ''}</b>
        <div class="small">${formatDuration(p.survival_seconds)} survived · ${p.tags_count} tags · caught ${p.times_caught}×${game.mode === 'classic' ? ` · ${formatDuration(p.it_total_seconds)} as IT` : ''}${p.left_at ? ' · left early' : ''}</div></div>
    </div>`)}
    ${trail.length > 1 && html`<${Section}>Your route<//><${RouteMap} game=${game} trail=${trail} /><div class="small">Only you can see your route.</div>`}
    ${g.history.length > 0 && html`<${Section}>Tag history<//><${Card}>${g.history.map((h) => html`<div style="padding:4px 0">
      <span class="small">${new Date(h.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}  </span>
      ${h.kind === 'auto_assign' ? `${g.profileOf(h.new_it)?.username} started as IT` : h.kind === 'escalation' ? `${g.profileOf(h.new_it)?.username} became a hunter`
        : h.kind === 'penalty' ? `${g.profileOf(h.new_it)?.username} became IT (penalty)` : `${g.profileOf(h.previous_it)?.username} ${KIND_VERB[h.kind]} ${g.profileOf(h.new_it)?.username}`}
    </div>`)}<//>`}
    <div class="gap12 mt24">
      <${Button} big variant="it" icon="🏠" title="BACK HOME" onClick=${() => replace('/home')} />
      <${Button} variant="secondary" icon="📤" title="Share results" onClick=${share} />
    </div>
  <//>`;
}
function RouteMap({ game, trail }) {
  const ref = useRef();
  const map = useLeafletMap(ref, { bounds: [...trail, ...game.boundary], interactive: false });
  useEffect(() => {
    if (!map) return;
    L.polygon(game.boundary.map(toLL), { color: C.boundary, weight: 2, fillOpacity: 0.08 }).addTo(map);
    L.polyline(trail.map(toLL), { color: C.me, weight: 4 }).addTo(map);
  }, [map]);
  return html`<div class="mini-map" style="height:220px;margin-top:0"><div class="map" ref=${ref}></div></div>`;
}

// ====================================================================== SETTINGS
function Settings() {
  const prefs = useStore(prefsStore);
  const { profile } = useStore(authStore);
  const [perm, setPerm] = useState('…');
  useEffect(() => { navigator.permissions?.query({ name: 'geolocation' }).then((p) => setPerm(p.state)).catch(() => setPerm('unknown')); }, []);
  const leaveAll = async () => {
    if (!confirm('Stop sharing everywhere? You will leave every game you are in (games you host will end).')) return;
    const { data } = await supabase.from('game_players').select('game_id, games(host_id, status)').eq('user_id', profile.id).is('left_at', null);
    for (const r of data || []) {
      if (!['lobby', 'countdown', 'active', 'paused'].includes(r.games?.status)) continue;
      await rpc(r.games.host_id === profile.id ? 'end_game' : 'leave_game', { g: r.game_id }).catch(() => {});
    }
    toast({ title: 'You are no longer sharing your location', tone: 'success' });
  };
  const testLocation = () => navigator.geolocation.getCurrentPosition(
    (p) => { setPerm('granted'); toast({ title: 'Location works!', body: `Accuracy ±${Math.round(p.coords.accuracy)} m`, tone: 'success' }); },
    () => { setPerm('denied'); toast({ title: 'Location is blocked', body: 'iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using the App, and turn on Precise Location.', tone: 'danger' }); },
    { enableHighAccuracy: true, timeout: 15000 });
  return html`<${Screen}>
    <${Header} title="Settings" />
    <${Section}>Profile<//><${Card}>
      <${LinkRow} icon="👤" label="Edit profile" sub=${profile?.username} onClick=${() => go('/profile-setup')} />
      <${LinkRow} icon="📊" label="Stats" onClick=${() => go('/profile')} />
    <//>
    <${Section}>Alerts<//><${Card}>
      <${Toggle} label="Nearby player alerts" sub="When IT (or a target) comes within ~120 m" value=${prefs.proximityAlerts} onChange=${(v) => setPref('proximityAlerts', v)} />
      <${Toggle} label="Vibration" sub="Android only — iPhones don't allow websites to vibrate" value=${prefs.haptics} onChange=${(v) => setPref('haptics', v)} />
    <//>
    <${Section}>Location<//><${Card}>
      <${LinkRow} label="Location permission" value=${perm === 'granted' ? 'Allowed' : perm === 'denied' ? 'Blocked' : 'Not asked'} onClick=${testLocation} />
      <div class="small" style="padding:8px 0">On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → <b>While Using the App</b>, with <b>Precise Location</b> on. Keep the game open on screen while you play.</div>
    <//>
    <${Section}>Map<//><${Card}>
      <${Segmented} value=${prefs.mapType} onChange=${(v) => setPref('mapType', v)} options=${[{ value: 'dark', label: 'Dark' }, { value: 'streets', label: 'Streets' }, { value: 'satellite', label: 'Satellite' }]} />
      <${Toggle} label="Show names on map" value=${prefs.showNames} onChange=${(v) => setPref('showNames', v)} />
      <${Toggle} label="Show GPS accuracy circle" value=${prefs.showAccuracy} onChange=${(v) => setPref('showAccuracy', v)} />
      <${Toggle} label="Follow my position" value=${prefs.followMe} onChange=${(v) => setPref('followMe', v)} />
    <//>
    <${Section}>Privacy<//><${Card}>
      <div class="muted" style="line-height:1.6">• Your location is only shared during a game you joined and agreed to.<br/>• Only people in that same game can see it.<br/>• Live positions are deleted when the game ends. Only you can see your own route.<br/>• A green LIVE badge shows whenever you're sharing.</div>
      <${LinkRow} icon="✋" label="Stop sharing & leave all games" onClick=${leaveAll} />
    <//>
  <//>`;
}

// ===== play.js =====

const EVENT_TONE = {
  you_are_it: 'it', it_changed: 'info', infected: 'info', player_out: 'info', eliminated: 'danger',
  oob_exit: 'warning', oob_warning: 'warning', oob_paused: 'danger', oob_disqualified: 'danger', oob_return: 'success',
  speed_warning: 'warning', speed_ok: 'success', penalty: 'danger', freed: 'success', countdown: 'info', started: 'it',
  paused: 'warning', resumed: 'success', game_over: 'it', three_left: 'warning', escalation: 'warning', dispute: 'warning',
  tag_disputed: 'warning', tag_overturned: 'info', host_oob: 'warning', host_speed: 'warning', host_penalty: 'warning', host_oob_return: 'info',
};
const SILENT = new Set(['join', 'leave', 'tag_request']);
const NEARBY_M = 120, EDGE_WARN_M = 40;

function Play({ id }) {
  const onEvent = useCallback((e) => {
    if (SILENT.has(e.kind)) return;
    toast({ title: e.title, body: e.body, tone: EVENT_TONE[e.kind] || 'info' });
    if (e.kind === 'you_are_it') vibrate([0, 300, 100, 300, 100, 300]);
  }, []);
  const g = useGame(id, onEvent);
  if (g.loading || !g.game) return html`<${Loading} label=${g.error || 'Joining the game…'} />`;
  return html`<${PlayView} id=${id} g=${g} />`;
}

function PlayView({ id, g }) {
  const { profile } = useStore(authStore);
  const prefs = useStore(prefsStore);
  const now = useNow(1000);
  const game = g.game;
  const me = g.playerOf(profile?.id);
  const sharingEnabled = !!game && !!me && me.role === 'player' && !me.left_at && !!me.consented_at && ['countdown', 'active', 'paused'].includes(game.status);
  const sharing = useLocationSharing(id, sharingEnabled);

  const [selected, setSelected] = useState(null);
  const [tagOpen, setTagOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [disputesOpen, setDisputesOpen] = useState(false);
  const [busy, setBusy] = useState(null);

  // "Tag who?": when IT has more than one runner in reach, nobody is auto-tagged and IT picks
  const [choices, setChoices] = useState([]);
  const snoozeUntil = useRef(0);
  const canChoose = game?.status === 'active' && game?.mode !== 'team' && !!me?.is_it && !me?.is_eliminated && !isFrozen(me);
  useEffect(() => {
    if (!canChoose) { setChoices([]); return; }
    let alive = true;
    const check = async () => {
      if (Date.now() < snoozeUntil.current) return;
      const { data } = await supabase.rpc('nearby_targets', { g: game.id });
      if (alive) setChoices(Array.isArray(data) ? data : []);
    };
    check();
    const t = setInterval(check, 2000);
    return () => { alive = false; clearInterval(t); };
  }, [game?.id, canChoose]);
  const prevChoiceCount = useRef(0);
  useEffect(() => {
    if (choices.length >= 2 && prevChoiceCount.current < 2) vibrate([0, 150, 80, 150]);
    prevChoiceCount.current = choices.length;
  }, [choices.length]);

  // server clock nudges (idempotent)
  useEffect(() => {
    if (!game || !['countdown', 'active'].includes(game.status)) return;
    const t = setInterval(() => rpc('tick_game', { g: game.id }).catch(() => {}), 5000);
    return () => clearInterval(t);
  }, [game?.id, game?.status]);
  useEffect(() => {
    if (!game) return;
    if ((game.status === 'countdown' && game.starts_at && new Date(game.starts_at) <= now) ||
        (game.status === 'active' && game.ends_at && new Date(game.ends_at) <= now)) rpc('tick_game', { g: game.id }).catch(() => {});
  }, [Math.floor(now / 1000)]);
  useEffect(() => {
    if (!game) return;
    if (['finished', 'lobby'].includes(game.status)) replace(gamePath(game));
    if (game.status === 'cancelled') replace('/home');
  }, [game?.status]);

  const myPos = sharing.position || (me ? g.locations[me.user_id] : null) || null;
  // IT radar: IT only sees runners at each ping
  const pingMode = !!game.it_ping_seconds && game.mode !== 'team';
  const viaPing = pingMode && !!me?.is_it && !me.is_eliminated && me.role === 'player';
  const amRunner = pingMode && !!me && me.role === 'player' && !me.is_it && !me.is_eliminated && !me.left_at;
  // IT sees runners only at pings; runners see IT only at pings
  const seesViaPing = (p) => p.user_id !== me?.user_id && ((viaPing && !p.is_it) || (amRunner && p.is_it));
  const PING_SHOW_MS = 10000; // each ping is visible to IT for 10s, then fades away
  const pingVisible = (pg) => !!pg && now - new Date(pg.pinged_at).getTime() < PING_SHOW_MS;
  const locOf = (p) => (seesViaPing(p) ? (pingVisible(g.pings[p.user_id]) ? g.pings[p.user_id] : null) : g.locations[p.user_id]);
  const nextPing = pingMode && game.last_ping_at && game.status === 'active'
    ? Math.max(0, game.it_ping_seconds - (now - new Date(game.last_ping_at).getTime()) / 1000) : null;

  // ---------- map
  const mapRef = useRef();
  const map = useLeafletMap(mapRef, { bounds: game?.boundary?.length ? game.boundary : undefined });
  const layers = useRef(null);
  const markers = useRef(new Map());
  const fitted = useRef(false);
  useEffect(() => {
    if (!map) return;
    layers.current = { static: L.layerGroup().addTo(map), dyn: L.layerGroup().addTo(map), players: L.layerGroup().addTo(map) };
    map.on('click', () => setSelected(null));
    map.on('dragstart', () => prefsStore.get().followMe && setPref('followMe', false));
  }, [map]);
  useEffect(() => {
    if (!map || !layers.current || !game) return;
    const s = layers.current.static; s.clearLayers();
    if (game.boundary.length >= 3) {
      L.polygon(game.boundary.map(toLL), { color: C.boundary, weight: 4, fillOpacity: 0.08, interactive: false }).addTo(s);
      if (!fitted.current) { map.fitBounds(L.latLngBounds(game.boundary.map(toLL)), { padding: [20, 20] }); fitted.current = true; }
    }
    game.safe_zones.forEach((z) => {
      L.circle(toLL(z), { radius: z.radius, color: C.safe, weight: 2, fillOpacity: 0.18, interactive: false }).addTo(s);
      L.marker(toLL(z), { interactive: false, icon: L.divIcon({ className: '', html: '<div class="safe-mk">🛡️</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(s);
    });
  }, [map, game?.boundary, game?.safe_zones]);

  const iAmTagger = isTagger(me, game);
  // dynamic: accuracy + tag radius
  useEffect(() => {
    if (!map || !layers.current) return;
    const d = layers.current.dyn; d.clearLayers();
    if (prefs.showAccuracy && sharing.position?.accuracy) L.circle(toLL(sharing.position), { radius: sharing.position.accuracy, color: C.me, weight: 1, opacity: 0.5, fillOpacity: 0.12, interactive: false }).addTo(d);
    if (iAmTagger && myPos && game?.status === 'active') L.circle(toLL(myPos), { radius: game.tag_radius_m, color: C.it, weight: 1.5, dashArray: '6 6', fillOpacity: 0.08, interactive: false }).addTo(d);
  }, [map, sharing.position, prefs.showAccuracy, iAmTagger, game?.status, game?.tag_radius_m]);

  // players
  useEffect(() => {
    if (!map || !layers.current || !game) return;
    const keep = new Set();
    for (const p of g.players) {
      const isMe = p.user_id === profile?.id;
      const fromPing = seesViaPing(p);
      const loc = isMe && sharing.position ? sharing.position : locOf(p);
      if (!loc) continue;
      let st = playerState(p, fromPing ? { updated_at: game.last_ping_at } : g.locations[p.user_id], game, now);
      if (fromPing && st === 'inactive') st = 'active';
      if (st === 'left' || st === 'spectator') continue;
      if (isMe && st === 'inactive') st = p.is_it ? 'it' : 'active';
      keep.add(p.user_id);
      const iconHtml = playerIconHtml({ profile: p.profile, state: st, isMe, teamColor: game.mode === 'team' && p.team ? TEAM_INFO[p.team].color : null,
        frozen: p.is_paused || isFrozen(p, now), showName: prefs.showNames, pinged: fromPing });
      let m = markers.current.get(p.user_id);
      if (!m) {
        m = L.marker(toLL(loc), { icon: L.divIcon({ className: '', html: iconHtml, iconSize: [64, 64], iconAnchor: [32, 32] }) }).addTo(layers.current.players);
        m._gtHtml = iconHtml;
        m.on('click', (e) => { L.DomEvent.stopPropagation(e); setSelected(p.user_id); });
        markers.current.set(p.user_id, m);
      } else {
        m.setLatLng(toLL(loc));
        if (m._gtHtml !== iconHtml) { m.setIcon(L.divIcon({ className: '', html: iconHtml, iconSize: [64, 64], iconAnchor: [32, 32] })); m._gtHtml = iconHtml; }
      }
      m.setZIndexOffset(st === 'it' ? 1000 : isMe ? 900 : 0);
    }
    for (const [uid, m] of markers.current) if (!keep.has(uid)) { m.remove(); markers.current.delete(uid); }
  }, [map, g.players, g.locations, g.pings, viaPing, sharing.position, Math.floor(now / (pingMode ? 1000 : 5000)), prefs.showNames, game?.mode]);

  useEffect(() => { if (prefs.followMe && map && sharing.position) map.panTo(toLL(sharing.position)); }, [prefs.followMe, sharing.position]);

  // ---------- client-side alerts
  const nearby = useRef(new Map()), edgeAt = useRef(0);
  useEffect(() => {
    if (!game || !me || !myPos || game.status !== 'active' || me.is_eliminated) return;
    if (prefs.proximityAlerts && !pingMode) for (const p of g.players) {
      const loc = g.locations[p.user_id];
      if (!loc || p.user_id === me.user_id || p.left_at || p.is_eliminated || p.role !== 'player') continue;
      const threat = game.mode === 'team' ? p.team !== me.team : me.is_it ? !p.is_it : p.is_it;
      if (!threat) continue;
      const d = distanceM(myPos, loc);
      if (d < NEARBY_M && Date.now() - (nearby.current.get(p.user_id) || 0) > 60000) {
        nearby.current.set(p.user_id, Date.now());
        toast({ title: me.is_it || game.mode === 'team' ? 'A player has entered your area' : '⚠️ IT is nearby!', body: `${p.profile?.username} is ${formatDistance(d)} away.`, tone: me.is_it ? 'info' : 'warning' });
      }
    }
    if (game.boundary.length >= 3 && pointInPolygon(myPos, game.boundary)) {
      const edge = distanceToEdgeM(myPos, game.boundary);
      if (edge < EDGE_WARN_M && Date.now() - edgeAt.current > 60000) {
        edgeAt.current = Date.now();
        toast({ title: 'You are approaching the game boundary', body: `${Math.round(edge)} m to the edge.`, tone: 'warning' });
      }
    }
  }, [myPos?.latitude, myPos?.longitude, g.locations]);

  const isHost = game.host_id === profile?.id;
  const active = g.players.filter((p) => p.role === 'player' && !p.left_at);
  const its = active.filter((p) => p.is_it && !p.is_eliminated);
  const remaining = remainingCount(g.players, game);
  const frozen = me ? isFrozen(me, now) : false;
  const incoming = g.requests.find((r) => r.status === 'pending' && r.target_id === profile?.id);
  const outgoing = g.requests.find((r) => r.status === 'pending' && r.tagger_id === profile?.id);
  const disputes = isHost ? g.requests.filter((r) => r.status === 'disputed') : [];

  const run = async (k, fn, ok) => {
    setBusy(k);
    try { await fn(); if (ok) toast({ title: ok, tone: 'success' }); }
    catch (e) { toast({ title: e.message || 'Something went wrong', tone: 'danger' }); }
    finally { setBusy(null); }
  };
  const requestTag = (t) => run('tag', async () => { await sharing.sendNow(); await rpc('request_tag', { g: game.id, target: t.user_id }); setTagOpen(false); setSelected(null); },
    `Tagged ${t.profile?.username}!`);
  const recenter = () => myPos ? map.setView(toLL(myPos), 17) : map.fitBounds(L.latLngBounds(game.boundary.map(toLL)));

  let timer = formatClock(gameSecondsLeft(game, now));
  if (game.status === 'countdown' && game.starts_at) timer = `Starts in ${formatClock((new Date(game.starts_at) - now) / 1000)}`;
  if (game.status === 'paused') timer = `⏸ ${timer}`;

  const fixAge = sharing.lastFixAt ? (now - sharing.lastFixAt) / 1000 : Infinity;
  const acc = sharing.position?.accuracy;
  const gpsColor = !sharingEnabled ? 'var(--faint)' : sharing.permission === 'denied' || fixAge > 30 ? C.danger : acc > 25 ? C.warning : C.success;

  const localOutside = !!sharing.position && game.boundary.length >= 3 && !pointInPolygon(sharing.position, game.boundary);
  const showOob = sharingEnabled && !me?.is_eliminated && (me?.is_out_of_bounds || localOutside);
  const oobLeft = me?.out_of_bounds_since ? Math.max(0, game.grace_seconds - (now - new Date(me.out_of_bounds_since)) / 1000) : game.grace_seconds;
  const oobPenalty = { become_it: me?.is_it ? 'or get frozen' : 'or you become IT', warn: 'or the host is alerted', pause: 'or you get frozen', disqualify: 'or you’re disqualified' }[game.out_of_bounds_action];

  const limitMs = game.speed_limit_mph ? game.speed_limit_mph * 0.44704 : null;
  const localSpeeding = !!limitMs && (sharing.position?.speed || 0) > limitMs;
  const showSpeed = sharingEnabled && game.status === 'active' && !me?.is_eliminated && (!!me?.speeding_since || localSpeeding);
  const speedLeft = me?.speeding_since ? Math.max(0, game.speed_grace_seconds - (now - new Date(me.speeding_since)) / 1000) : game.speed_grace_seconds;
  const mph = Math.round((sharing.position?.speed || 0) / 0.44704);

  const sel = selected ? g.playerOf(selected) : null;

  const candidates = g.players.filter((p) => canTag(me, p, game) && (locOf(p) || viaPing))
    .map((p) => ({ p, d: myPos && locOf(p) ? distanceM(myPos, locOf(p)) : Infinity })).sort((a, b) => a.d - b.d);

  return html`<div class="full">
    <div class="map" ref=${mapRef}></div>

    <div class="hud-top">
      <${ItBanner} game=${game} its=${its} meId=${profile?.id} players=${active} />
      <div class="pills">
        <span class="pill" style="font-variant-numeric:tabular-nums;color:var(--it)">⏱ ${timer}</span>
        <span class="pill">👥 ${remaining} ${game.mode === 'classic' || game.mode === 'team' ? 'playing' : 'left'}</span>
        ${sharingEnabled
          ? html`<span class="pill" style=${{ color: gpsColor }}><span class="dot" style=${{ background: gpsColor }}></span>
              ${sharing.permission === 'denied' ? 'NO GPS' : fixAge > 30 ? 'GPS LOST' : `LIVE ±${acc != null ? Math.round(acc) : '?'}m`}</span>`
          : html`<span class="pill">${me?.role === 'spectator' ? '👀 SPECTATING' : 'NOT SHARING'}</span>`}
        ${nextPing != null && html`<span class="pill" style=${{ color: C.amber }}>📡 Next ping ${formatClock(nextPing)}</span>`}
        ${!g.connected && html`<span class="pill" style="background:var(--warning);color:var(--on-amber)">RECONNECTING…</span>`}
        ${sharing.offline && g.connected && html`<span class="pill" style="background:var(--warning);color:var(--on-amber)">OFFLINE</span>`}
      </div>
      ${sharing.permission === 'denied' && html`<div class="banner" style="background:var(--danger)"><div class="t">Location is off</div>
        <div class="b">iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using, then reload.</div></div>`}
      ${showOob && html`<div class="banner" style="background:var(--danger)"><div class="t">🚧 OUT OF BOUNDS</div>
        <div class="b">${me?.oob_penalized ? 'Get back inside the yellow boundary!' : `Get back inside within ${Math.ceil(oobLeft)}s ${oobPenalty}.`}</div></div>`}
      ${showSpeed && html`<div class="banner" style="background:#b45309"><div class="t">🚗 SLOW DOWN! ${mph > 0 ? mph + ' mph' : ''}</div>
        <div class="b">No vehicles. Stay under ${game.speed_limit_mph} mph${me?.speeding_since ? ` — ${Math.ceil(speedLeft)}s ${me.is_it ? 'until you’re frozen' : 'until you become IT'}` : ''}.</div></div>`}
      ${frozen && html`<div class="banner" style="background:#1e3a8a"><div class="t">🧊 FROZEN</div><div class="b">You can't tag for ${Math.ceil((new Date(me.frozen_until) - now) / 1000)}s.</div></div>`}
      ${me?.is_paused && html`<div class="banner" style="background:#1e3a8a"><div class="t">🧊 FROZEN</div><div class="b">Return inside the boundary to unfreeze.</div></div>`}
      ${me?.is_eliminated && html`<div class="banner" style="background:var(--card2)"><div class="t">💀 You're out</div><div class="b">Keep watching the map${game.allow_rejoin ? ' — you can rejoin from the menu after 2 minutes' : ''}.</div></div>`}
      ${outgoing && html`<div class="banner glass row"><div class="b grow">⏳ Waiting for ${g.profileOf(outgoing.target_id)?.username} to confirm your tag…</div>
        <button style="color:var(--muted);font-weight:700" onClick=${() => run('c', () => rpc('cancel_tag', { request: outgoing.id }))}>Cancel</button></div>`}
      ${disputes.length > 0 && html`<div class="banner" style="background:var(--warning);color:var(--on-amber)" onClick=${() => setDisputesOpen(true)}>
        <div class="t">⚖️ ${disputes.length} disputed tag${disputes.length > 1 ? 's' : ''}</div><div class="b">Tap to decide.</div></div>`}
    </div>

    ${game.status === 'countdown' && game.starts_at && html`<div class="overlay">
      <div class="big-count">${Math.max(0, Math.ceil((new Date(game.starts_at) - now) / 1000))}</div>
      <div class="big-sub">${me?.is_it ? "YOU'RE IT — WAIT FOR IT…" : 'SCATTER!'}</div></div>`}
    ${game.status === 'paused' && html`<div class="overlay"><div class="big-sub" style="font-size:36px">⏸ PAUSED</div><div class="muted">The host paused the game</div></div>`}

    <div class="hud-bottom">
      <div class="side-btns">
        <button class=${`round glass ${prefs.followMe ? 'on' : ''}`} onClick=${() => { setPref('followMe', !prefs.followMe); if (!prefs.followMe) recenter(); }}>🧭</button>
        <button class="round glass" onClick=${() => map.fitBounds(L.latLngBounds(game.boundary.map(toLL)), { padding: [20, 20] })}>🗺️</button>
      </div>
      <div class="bar glass">
        <button class="bar-btn" onClick=${() => go(`/g/${game.id}/players`)}>👥<span>Players</span></button>
        ${iAmTagger && game.status === 'active'
          ? html`<button class="tag-btn" style=${frozen || me?.is_paused ? { opacity: 0.4 } : null} disabled=${frozen || me?.is_paused} onClick=${() => setTagOpen(true)}>TAG!</button>`
          : html`<div class="tag-btn off">${me?.role === 'spectator' ? '👀' : me?.is_eliminated ? '💀' : 'RUN!'}</div>`}
        <button class="bar-btn" onClick=${() => setMenuOpen(true)}>☰<span>${isHost ? 'Host' : 'Menu'}</span></button>
      </div>
    </div>

    ${sel && html`<${PlayerCard} p=${sel} game=${game} now=${now} me=${me} myPos=${myPos} loc=${locOf(sel) && (locOf(sel).updated_at ? locOf(sel) : { ...locOf(sel), updated_at: locOf(sel).pinged_at })}
      busy=${busy === 'tag'} onTag=${() => requestTag(sel)} onClose=${() => setSelected(null)} />`}

    <${Sheet} open=${tagOpen} onClose=${() => setTagOpen(false)} title="Tag someone">
      <div class="small" style="margin-bottom:10px">Tags happen automatically when you get within ${game.tag_radius_m} m. If GPS is lagging, tap the person you just tagged. The game checks your real positions and tags them instantly.</div>
      ${candidates.length === 0 ? html`<div class="muted">No one you can tag right now.</div>` : candidates.map(({ p, d }) => {
        const loc = locOf(p);
        const allowed = game.tag_radius_m + Math.min((acc || 0) + (loc?.accuracy || 0), game.tag_radius_m);
        const inRange = !viaPing && d <= allowed, safe = !viaPing && loc && inSafeZone(loc, game.safe_zones);
        return html`<div class="list-row tap" style=${inRange && !safe ? { borderColor: C.it, background: '#69121B' } : null} onClick=${() => busy !== 'tag' && requestTag(p)}>
          <${Avatar} profile=${p.profile} size=${44} />
          <div class="grow"><b>${p.profile?.username}</b><div class="small">${viaPing ? (isFinite(d) ? `~${formatDistance(d)} at this ping` : 'Hidden until the next ping') : `${safe ? '🛡️ In a safe zone' : inRange ? 'In range' : 'Too far'} · ${formatDistance(d)}`}</div></div>
          <span style="font-size:22px">${inRange && !safe ? '✋' : '·'}</span></div>`;
      })}
    <//>

    <${Modal} open=${choices.length >= 2} borderColor=${C.it}>
      <div class="big-sub" style="text-align:center;font-size:30px">TAG WHO?</div>
      <div class="muted" style="text-align:center;margin:4px 0 14px">${choices.length} players are right next to you</div>
      ${choices.map((c) => html`<div class="list-row tap" style=${{ borderColor: C.it, background: '#69121B' }}
          onClick=${() => busy !== 'tag' && run('tag', async () => { await rpc('request_tag', { g: game.id, target: c.user_id }); setChoices([]); }, `Tagged ${c.username}!`)}>
        <${Avatar} profile=${g.profileOf(c.user_id) || c} size=${44} />
        <div class="grow"><b>${c.username}</b><div class="small">${c.distance} m away</div></div>
        <span style="font-size:22px">✋</span></div>`)}
      <${Button} variant="it" big title="🎲 RANDOM" loading=${busy === 'tag'} style="margin-top:6px"
        onClick=${() => { const c = choices[Math.floor(Math.random() * choices.length)]; run('tag', async () => { await rpc('request_tag', { g: game.id, target: c.user_id }); setChoices([]); }, `Tagged ${c.username}!`); }} />
      <${Button} variant="ghost" title="Not now" style="margin-top:6px" onClick=${() => { snoozeUntil.current = Date.now() + 8000; setChoices([]); }} />
    <//>

    <${Modal} open=${!!incoming} borderColor=${C.it}>
      ${incoming && html`
        <div class="center-col"><${Avatar} profile=${g.profileOf(incoming.tagger_id)} size=${72} ring=${C.it} />
        <div class="big-sub mt12" style="font-size:26px">YOU'VE BEEN TAGGED!</div>
        <div class="muted mt8">${g.profileOf(incoming.tagger_id)?.username} says they tagged you${incoming.distance_m != null ? ` (GPS: ${Math.round(incoming.distance_m)} m apart)` : ''}.</div>
        <div class="small mt8">Goes to the host in ${Math.max(0, Math.ceil(game.tag_confirm_timeout_seconds - secondsSince(incoming.created_at, now)))}s</div></div>
        <${Button} big variant="it" title="YES, I'M TAGGED" loading=${busy === 'confirm'} style="margin-top:18px"
          onClick=${() => run('confirm', () => rpc('respond_tag', { request: incoming.id, accept: true }))} />
        <${Button} variant="secondary" title="No — dispute it" loading=${busy === 'dispute'} style="margin-top:10px"
          onClick=${() => run('dispute', () => rpc('respond_tag', { request: incoming.id, accept: false }), 'Sent to the host')} />`}
    <//>

    <${Sheet} open=${disputesOpen && disputes.length > 0} onClose=${() => setDisputesOpen(false)} title="Disputed tags">
      ${disputes.map((r) => html`<div class="card" style="margin-bottom:10px;background:var(--card2)">
        <b>${g.profileOf(r.tagger_id)?.username} → ${g.profileOf(r.target_id)?.username}</b>
        <div class="small">${r.distance_m != null ? `${Math.round(r.distance_m)} m apart by GPS · ` : ''}${timeAgo(r.created_at, now)}</div>
        <div class="row mt12">
          <${Button} variant="it" title="Tag counts" onClick=${() => run('r', () => rpc('resolve_tag', { request: r.id, uphold: true }), 'Tag upheld')} />
          <${Button} variant="secondary" title="No tag" onClick=${() => run('r', () => rpc('resolve_tag', { request: r.id, uphold: false }), 'Tag overturned')} />
        </div></div>`)}
    <//>

    <${Sheet} open=${menuOpen} onClose=${() => setMenuOpen(false)} title=${isHost ? 'Host controls' : 'Menu'}>
      <div class="small" style="margin-bottom:12px">${MODE_INFO[game.mode].emoji} ${game.name} · code ${game.code}</div>
      <div class="gap8">
        ${isHost && game.status === 'active' && html`<${Button} variant="secondary" icon="⏸" title="Pause game" loading=${busy === 'pause'} onClick=${() => run('pause', () => rpc('pause_game', { g: game.id }))} />`}
        ${isHost && game.status === 'paused' && html`<${Button} variant="success" icon="▶" title="Resume game" loading=${busy === 'resume'} onClick=${() => run('resume', () => rpc('resume_game', { g: game.id }))} />`}
        ${isHost && disputes.length > 0 && html`<${Button} variant="secondary" icon="⚖️" title=${`Resolve disputes (${disputes.length})`} onClick=${() => { setMenuOpen(false); setDisputesOpen(true); }} />`}
        ${me?.is_eliminated && game.allow_rejoin && game.status === 'active' && html`<${Button} variant="success" icon="🔄" title="Rejoin the game" loading=${busy === 'rejoin'} onClick=${() => run('rejoin', () => rpc('rejoin_play', { g: game.id }), "You're back in!")} />`}
        <${Button} variant="secondary" icon="🗺️" title=${`Map: ${prefs.mapType}`} onClick=${() => setPref('mapType', prefs.mapType === 'dark' ? 'streets' : prefs.mapType === 'streets' ? 'satellite' : 'dark')} />
        <${Button} variant="secondary" icon="⚙️" title="Settings" onClick=${() => { setMenuOpen(false); go('/settings'); }} />
        ${isHost
          ? html`<${Button} variant="danger" title="End game for everyone" onClick=${() => confirm('End the game? Final results will be shown to everyone.') && run('end', () => rpc('end_game', { g: game.id }))} />`
          : html`<${Button} variant="danger" title="Stop sharing & leave game" onClick=${() => confirm(`Leave the game? Your location stops being shared immediately.${game.allow_rejoin ? '' : " You won't be able to rejoin."}`) &&
              run('leave', async () => { await rpc('leave_game', { g: game.id }); replace('/home'); })} />`}
      </div>
    <//>
  </div>`;
}

function ItBanner({ game, its, meId, players }) {
  if (game.mode === 'team') {
    const n = (t) => players.filter((p) => p.team === t && !p.is_eliminated).length;
    const mine = players.find((p) => p.user_id === meId)?.team;
    return html`<div class="it-banner glass" style="justify-content:center;flex-direction:column;gap:0;border-color:var(--border)">
      <div class="row"><span class="n" style=${{ color: TEAM_INFO.alpha.color }}>${TEAM_INFO.alpha.name.toUpperCase()} ${n('alpha')}</span>
        <span class="l">VS</span><span class="n" style=${{ color: TEAM_INFO.bravo.color }}>${n('bravo')} ${TEAM_INFO.bravo.name.toUpperCase()}</span></div>
      ${mine && html`<div class="l">You're on ${TEAM_INFO[mine].name}</div>`}</div>`;
  }
  const meIt = its.some((p) => p.user_id === meId);
  if (!its.length) return html`<div class="it-banner"><div class="n">Picking IT…</div></div>`;
  if (its.length === 1) {
    const p = its[0];
    return html`<div class=${`it-banner ${meIt ? 'me' : ''}`}>
      <${Avatar} profile=${p.profile} size=${34} ring=${C.cherry} />
      <div class="grow"><div class="l">CURRENTLY IT</div><div class="n ellipsis">${meIt ? "YOU'RE IT!" : p.profile?.username}</div></div>
      <span class="it-badge">IT</span></div>`;
  }
  return html`<div class=${`it-banner ${meIt ? 'me' : ''}`}>
    <div class="row" style="gap:0">${its.slice(0, 4).map((p, i) => html`<${Avatar} profile=${p.profile} size=${30} ring=${C.cherry} style=${{ marginLeft: i ? '-10px' : 0 }} />`)}</div>
    <div class="grow"><div class="l">${meIt ? "YOU'RE ON THE IT TEAM" : `IT TEAM · ${its.length}`}</div><div class="n ellipsis" style="font-size:18px">${its.map((p) => p.profile?.username).join(', ')}</div></div></div>`;
}

function PlayerCard({ p, game, now, me, myPos, loc, onTag, onClose, busy }) {
  const st = playerState(p, loc, game, now);
  const isMe = p.user_id === me?.user_id;
  const d = myPos && loc && !isMe ? distanceM(myPos, loc) : null;
  return html`<div class="pcard" style="bottom:calc(var(--sb) + 112px)">
    <button style="position:absolute;right:14px;top:10px;font-size:20px;color:var(--muted)" onClick=${onClose}>✕</button>
    <div class="row" style="gap:12px">
      <${Avatar} profile=${p.profile} size=${56} ring=${st === 'it' ? C.it : isMe ? C.me : C.player} dim=${st === 'eliminated'} />
      <div class="grow"><div class="row" style="gap:6px"><span class="h2">${p.profile?.username}${isMe ? ' (you)' : ''}</span>${p.is_it && html`<span class="it-badge">IT</span>`}</div>
        <div class="muted">${STATE_LABEL[st]}${game.mode === 'team' && p.team ? ' · ' + TEAM_INFO[p.team].name : ''}${p.user_id === game.host_id ? ' · 👑 Host' : ''}</div></div>
    </div>
    <div class="row" style="margin:12px 0">
      ${[['Survived', formatDuration(survivalSeconds(p, game, now))], ['Tags', p.tags_count], ['Distance', d != null ? formatDistance(d) : '—'], ['Updated', timeAgo(loc?.updated_at, now)]]
        .map(([l, v]) => html`<div class="grow"><b>${v}</b><div class="small">${l}</div></div>`)}
    </div>
    ${loc?.accuracy != null && html`<div class="small">GPS accuracy ±${Math.round(loc.accuracy)} m</div>`}
    ${canTag(me, p, game) && html`<${Button} variant="it" title=${`✋ TAG ${(p.profile?.username || '').toUpperCase()}`} loading=${busy} onClick=${onTag} style="margin-top:12px" />`}
  </div>`;
}

// ===== main.js =====
let redirecting = false;
const redirect = (p) => { if (redirecting) return; redirecting = true; setTimeout(() => { redirecting = false; replace(p); }, 0); };

function Router() {
  const { path } = useStore(routeStore);
  const auth = useStore(authStore);
  const { parts, query } = parseRoute(path);

  useEffect(() => { window.scrollTo(0, 0); }, [path]);

  if (!isConfigured) {
    return html`<${Screen}><h1 class="h1" style="margin-top:80px">Almost there</h1>
      <p>Open <b>config.js</b> and paste in your Supabase URL and anon key.</p><//>`;
  }
  if (auth.loading) return html`<${Loading} />`;

  // Gate: need a session, then a profile. Remember where they were going (e.g. an invite link).
  if (!auth.session) {
    if (parts[0] !== 'signin') { sessionStorage.setItem('gt:after-profile', path === '/' ? '/home' : path); redirect('/signin'); return null; }
    return html`<${SignIn} />`;
  }
  if (!auth.profile) {
    if (parts[0] !== 'profile-setup') { if (parts[0] !== 'signin' && path !== '/') sessionStorage.setItem('gt:after-profile', path); redirect('/profile-setup'); return null; }
    return html`<${ProfileSetup} />`;
  }

  const [a, b, c] = parts;
  if (!a || a === 'signin') {
    const next = sessionStorage.getItem('gt:after-profile');
    sessionStorage.removeItem('gt:after-profile');
    redirect(next && next !== '/signin' ? next : '/home');
    return null;
  }
  switch (a) {
    case 'home': return html`<${Home} />`;
    case 'profile-setup': return html`<${ProfileSetup} />`;
    case 'create': return html`<${CreateGame} />`;
    case 'boundary': return html`<${BoundaryEditor} gameId=${query.game} />`;
    case 'join': return html`<${Join} code=${query.code} key=${query.code || 'join'} />`;
    case 'profile': return html`<${Profile} />`;
    case 'settings': return html`<${Settings} />`;
    case 'g':
      if (c === 'lobby') return html`<${Lobby} id=${b} key=${b} />`;
      if (c === 'play') return html`<${Play} id=${b} key=${b} />`;
      if (c === 'players') return html`<${Players} id=${b} key=${b} />`;
      if (c === 'results') return html`<${Results} id=${b} key=${b} />`;
      if (c === 'edit') return html`<${EditGame} id=${b} key=${b} />`;
  }
  redirect('/home');
  return null;
}

function App() {
  return html`<${Router} /><${Toasts} />`;
}

render(html`<${App} />`, document.getElementById('app'));

</script>
</body>
